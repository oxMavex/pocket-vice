<script>
(function(){

const $=id=>document.getElementById(id);

const Q=new URLSearchParams(location.search);

const STS=['1st St','2nd St','3rd St','4th St','5th St','6th St'];
const CAFES=shuffle(['Little Crumb','Corner Cup','Morning Room','Two Spoons','Paper Moon','Sugar & Salt','Slow Drip','The Bread Box','Half Moon Bagels','Tiny Teapot']);
const SHOPS=shuffle(['Corner Market','Page Turner Books','Fix-It Hardware','Bloom Florist','Fresh Pick Grocer','Tape & Thread','Pocket Pharmacy','Second Spin Records']);
const OFFS=shuffle(['Ledger & Co','Northwind Studio','Atlas Insurance','Brightline Labs','Kettle Media','Parcel Post','City Records','Greenleaf Bank','Copperpot Design','Harlow Law','Bluefield Clinic','Fernway Tech','Quarry Press','Tallow Architects','Moss & Pine','Lantern Games']);

const cen=(NB-1)/2;

{const inner=blocks.filter(b=>b.d===1),outer=blocks.filter(b=>b.d===2);if(R()<.35)blocks.find(b=>b.d===0).type='park';else pick(inner).type='park';pick(outer).type='park';}

    const n=ri(7,10);for(let i=0;i<n;i++){const a=R()*Math.PI*2,r=rf(.55,1.35);let tx=Math.cos(a)*r,tz=Math.sin(a)*r;if(Math.abs(tx)<.16)tx+=.3;if(Math.abs(tz)<.16)tz+=.3;trees.push([W(cx)+tx,W(cz)+tz,rf(.8,1.3)]);}

    if(lx===1&&lz===1){trees.push([W(x0+1)+rf(-.12,.12),W(z0+1)+rf(-.12,.12),rf(1,1.35)]);continue;}

    let kind=b.type==='down'?WORK:HOME;

    const rc=[l.cx+l.dir[0],l.cz+l.dir[1]],door=[W(l.cx)+l.dir[0]*.47,W(l.cz)+l.dir[1]*.47];

    mkPlace(kind,l.cx,l.cz,ex);});
}
while(places.filter(p=>p.kind===CAFE).length<2){const h=pick(places.filter(p=>p.kind===HOME));h.kind=CAFE;h.floors=1;h.roof=false;h.name=CAFES[counters.c++%CAFES.length];}
if(!places.some(p=>p.kind===SHOP)){const h=pick(places.filter(p=>p.kind===HOME));h.kind=SHOP;h.floors=1;h.roof=false;h.name=SHOPS[0];}

  uniforms:{t:{value:null},res:{value:new THREE.Vector2(1,1)},blur:{value:5},focus:{value:.42},band:{value:.17},sat:{value:1.12},vig:{value:.34}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',

   c+=texture2D(t,vUv+p*vec2(.519,.767)).rgb;c+=texture2D(t,vUv+p*vec2(.185,-.893)).rgb;c+=texture2D(t,vUv+p*vec2(.507,.064)).rgb;
   c+=texture2D(t,vUv+p*vec2(.896,.412)).rgb;c+=texture2D(t,vUv+p*vec2(-.322,-.933)).rgb;c+=texture2D(t,vUv+p*vec2(-.792,-.598)).rgb;c/=13.;}
  float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,sat);vec2 q=vUv-.5;c*=1.-dot(q,q)*vig;gl_FragColor=vec4(c,1.);}`,
  depthTest:false,depthWrite:false});

const hemi=new THREE.HemisphereLight(0xfff6e8,0xc2ae92,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd9b0,1.05);sun.castShadow=true;

Object.assign(sun.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:1,far:60});

const SUNDIR=new THREE.Vector3(-9,11,6);

// ---------- textures ----------
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}

  const P=64;g.fillStyle='#e3d9c5';g.fillRect(0,0,S,S);
  for(const b of blocks){const x0=(b.bx*ST+1)*P,z0=(b.bz*ST+1)*P,s=BS*P;
    if(b.type==='park'){g.fillStyle='#a9c38b';g.fillRect(x0,z0,s,s);
      if(b.place.pond){g.fillStyle='#9fbcbc';g.beginPath();g.ellipse(x0+s*.68,z0+s*.32,s*.13,s*.09,.4,0,7);g.fill();}
      g.strokeStyle='#ebdfc2';g.lineWidth=P*.14;g.beginPath();g.arc(x0+s/2,z0+s/2,s*.3,0,7);g.moveTo(x0+s/2,z0);g.lineTo(x0+s/2,z0+s);g.moveTo(x0,z0+s/2);g.lineTo(x0+s,z0+s/2);g.stroke();}
    else{g.fillStyle='#b5c998';g.fillRect(x0+P*1.1,z0+P*1.1,P*.8,P*.8);}}
  g.fillStyle='#d7cebd';for(let i=0;i<=NB;i++){const p=i*ST*P;g.fillRect(p,0,P,S);g.fillRect(0,p,S,P);}
  const aw=P*.56,ao=(P-aw)/2;g.fillStyle='#908c85';
  for(let i=0;i<=NB;i++){const p=i*ST*P;g.fillRect(p+ao,0,aw,S);g.fillRect(0,p+ao,S,aw);}
  g.strokeStyle='rgba(246,239,224,.7)';g.lineWidth=P*.035;g.setLineDash([P*.2,P*.22]);
  for(let i=0;i<=NB;i++){const p=i*ST*P+P/2;for(let k=0;k<NB;k++){const a=(k*ST+1)*P+P*.35,b=((k+1)*ST)*P-P*.35;g.beginPath();g.moveTo(p,a);g.lineTo(p,b);g.moveTo(a,p);g.lineTo(b,p);g.stroke();}}
  g.setLineDash([]);g.fillStyle='rgba(246,239,224,.85)';const L=P*.24;
  for(let i=0;i<=NB;i++)for(let j=0;j<=NB;j++){const cx=i*ST*P,cz=j*ST*P;

      if(i<NB)g.fillRect(cx+P+P*.06,cz+o,L,w);if(i>0)g.fillRect(cx-P*.06-L,cz+o,L,w);

const FW=8,FL=4;
const facadeT=canvasTex(256,256,(g)=>{g.fillStyle='#fff';g.fillRect(0,0,256,256);g.fillStyle='#76828a';
  for(let f=0;f<FL;f++)for(let i=0;i<FW;i++)g.fillRect(i*32+9,f*64+16,14,30);
  g.fillStyle='rgba(0,0,0,.06)';for(let f=0;f<FL;f++)g.fillRect(0,f*64+60,256,4);});

  for(let f=0;f<FL;f++)for(let i=0;i<FW;i++){const r=R();if(r<.5){g.fillStyle=r<.12?'#c98f4a':'#ffd38a';g.fillRect(i*32+9,f*64+16,14,30);}}});
winT.wrapS=winT.wrapT=THREE.RepeatWrapping;
const winOT=canvasTex(256,256,(g)=>{g.fillStyle='#000';g.fillRect(0,0,256,256);g.fillStyle='#fff3d6';
  for(let f=0;f<FL;f++)for(let i=0;i<FW;i++)g.fillRect(i*32+9,f*64+16,14,30);});

// ---------- static meshes ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(G,G),new THREE.MeshLambertMaterial({map:groundT}));

const lip=new THREE.Mesh(new THREE.BoxGeometry(G+.5,.06,G+.5),new THREE.MeshLambertMaterial({color:0xe9dfca}));lip.position.y=-.045;scene.add(lip);
const dummy=new THREE.Object3D(),col=new THREE.Color(),GREY=new THREE.Color('#a8a39a');
function inst(geo,mat,n,{cast=true,recv=true}={}){const m=new THREE.InstancedMesh(geo,mat,Math.max(1,n));m.count=n;m.castShadow=cast;m.receiveShadow=recv;scene.add(m);return m;}
function setI(m,i,x,y,z,ry,s,sy){dummy.position.set(x,y,z);dummy.rotation.set(0,ry||0,0);dummy.scale.set(s||1,sy||s||1,s||1);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);}

const WALLS={[HOME]:['#f3e6cf','#efd9bf','#e8cdb0','#f6efe2','#e6d9c3','#f0e2c8'],[WORK]:['#dfe2df','#ced6d7','#e8e4dc','#c9cfc8','#d8d2c6'],[CAFE]:['#f6e2b8'],[SHOP]:['#e7eedf']};

  for(const c of caps()){const a=sm(c[0],c[0]+.25,t)*(1-sm(c[1]-.25,c[1],t));if(a<=0)continue;g.font='780 '+40*u+'px '+UIF;const w=g.measureText(c[2]).width+60*u,x0=(W-w)/2,y=Hh-190*u+(1-a)*12*u;

}
