<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="S">
// NPC #48 · a scripted trailer · every building in this city is one word of this script
const R = THREE, $ = id => document.getElementById(id), DUR = 36.5, V = 0.45;
const cv = $('c'), hc = $('h'), g = hc.getContext('2d');
const ren = new R.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true,
  logarithmicDepthBuffer: true });
ren.toneMapping = R.ACESFilmicToneMapping; ren.toneMappingExposure = 0.72;
ren.outputEncoding = R.sRGBEncoding; ren.shadowMap.enabled = true;
ren.shadowMap.type = R.PCFSoftShadowMap;
const scene = new R.Scene(), cam = new R.PerspectiveCamera(36, 1, 0.04, 6000);
const HZ = new R.Color(1.3, 0.55, 0.25), SUN = new R.Vector3(-0.9, 0.38, -0.2).normalize();
scene.fog = new R.Fog(HZ.clone().multiplyScalar(0.8), 30, 200);
const sst = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
const lin = (a, b, x) => Math.min(1, Math.max(0, (x - a) / (b - a)));
const mix = (a, b, u) => a + (b - a) * u, v3 = (x, y, z) => new R.Vector3(x, y, z);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const trap = (u, r) => { const vm = 1 / (1 - r);
  return u < r ? .5 * vm * u * u / r : u > 1 - r ? 1 - .5 * vm * (1 - u) * (1 - u) / r : vm * (u - r / 2); };

// ---- the map: read this very script, one building per word ----
const SRC = $('S').textContent.replace(/^\s*\n/, '').replace(/\s+$/, '');
const LN = SRC.split('\n').map(s => s.replace(/\t/g, '  ').replace(/\s+$/, ''));
const N = LN.length, NC = 3, PER = Math.ceil(N / NC), P = 4, D = 2, CP = 122;
const X0 = k => k * CP - (NC * CP - 18) / 2, ZR = r => r * P - PER * P / 2;
const KW = /^(const|let|var|function|return|if|else|for|new|while|of|in|=>)$/;
const CSS = ['#ece6d8', '#ff8f6b', '#a6d987', '#f2c46d', '#8a93a1', '#a3b1c4'];
const SYN = CSS.map(c => new R.Color(c));
const WALL = ['#ead7b7', '#dba67c', '#c98169', '#f0e7d8', '#a9c3b6', '#d8ba8e', '#bca38b', '#e3c4a8'];
const HB = [[2.6, 4.5], [6, 6], [1.7, 1.6], [1.3, 1], [1.1, 1.1], [0.7, 0.6]];
const toks = [];
LN.forEach((s, i) => {
  const k = i / PER | 0, r = i % PER, re = /\S+/g; let m, com = false;
  while ((m = re.exec(s))) {
    const t = m[0]; if (t.startsWith('//')) com = true;
    const c = com ? 4 : /['"`]/.test(t) ? 2 : /^[\d.\-]+[,;)]*$/.test(t) ? 3
      : KW.test(t.replace(/[(;,]+$/, '')) ? 1 : /^[\w$]/.test(t) ? 0 : 5;
    const j = toks.length, hh = hash(j * 1.7 + i);
    toks.push({ i, k, r, s: m.index, e: m.index + t.length, t, c, z: ZR(r),
      x: X0(k) + m.index + t.length / 2, w: t.length - 0.25, h: HB[c][0] + HB[c][1] * hh * hh });
  }
});
const IT = N - 1, KT = IT / PER | 0, RT = IT % PER, XT = X0(KT), ZT = ZR(RT);
const ZS = ZT - P / 2, AX = XT + LN[IT].indexOf('leave') - 0.5, XH0 = AX + 3, ZH = ZS + 0.72;
const ZN = ZT + P, XE = XT + 35.6, XS = XH0 + V * 0.85 - 0.9 * 0.0625;
const CX = (X0(0) + X0(NC - 1) + 104) / 2;

// ---- buildings: windows from world position, code colours on the roofs ----
const U = { uCode: { value: 0 }, uNight: { value: 0.25 } };
const bMat = new R.MeshStandardMaterial({ roughness: 0.82 });
bMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, U);
  sh.vertexShader = 'attribute vec3 aSyn;varying vec3 vSyn,vW,vN;\n' + sh.vertexShader.replace(
    '#include <begin_vertex>', `#include <begin_vertex>
    vSyn = aSyn; mat4 mw = modelMatrix;
    #ifdef USE_INSTANCING
    mw = mw * instanceMatrix;
    #endif
    vW = (mw * vec4(transformed, 1.)).xyz; vN = normalize(mat3(mw) * objectNormal);`);
  sh.fragmentShader = 'uniform float uCode,uNight;varying vec3 vSyn,vW,vN;\n' +
    'float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n' +
    sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
    float win = 0., lit = 0., roof = step(.5, vN.y);
    if (abs(vN.y) < .5) {
      vec2 q = vec2((abs(vN.x) > .5 ? vW.z : vW.x) / .5, vW.y / .62), f = fract(q);
      win = step(.22, f.x) * step(f.x, .78) * step(.28, f.y) * step(f.y, .86) * step(.6, vW.y) * (1. - smoothstep(22., 60., distance(vW, cameraPosition)));
      lit = win * step(.7, hh(floor(q) + floor(vW.xz * .2)));
      vec3 gl = mix(vec3(.55, .38, .3), vec3(.09, .12, .18), f.y);
      diffuseColor.rgb = mix(diffuseColor.rgb, gl, win * .9);
      diffuseColor.rgb *= mix(.5, 1., smoothstep(0., .9, vW.y));
    } else diffuseColor.rgb *= .82;
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(.015, .016, .02), uCode);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
    roughnessFactor = mix(roughnessFactor, .3, win);`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
    totalEmissiveRadiance += vec3(1., .62, .3) * lit * uNight * (1. - uCode)
      + vSyn * uCode * roof * .07;`);
};
const M4 = new R.Matrix4(), Q = new R.Quaternion(), V0 = new R.Vector3(), S3 = new R.Vector3();
function blocks(list) {
  const geo = new R.BoxGeometry(1, 1, 1).translate(0, 0.5, 0), syn = new Float32Array(list.length * 3);
  const im = new R.InstancedMesh(geo, bMat, list.length);
  list.forEach((o, j) => { SYN[o.c].toArray(syn, j * 3);
    im.setColorAt(j, new R.Color(WALL[(hash(j + o.i * 7) * WALL.length) | 0])); });
  geo.setAttribute('aSyn', new R.InstancedBufferAttribute(syn, 3));
  im.castShadow = im.receiveShadow = true; im.frustumCulled = false; im.list = list;
  scene.add(im); return im;
}
let lastF = -1;
function lift(f) { if (f === lastF) return; lastF = f;
  city.list.forEach((o, j) => { M4.compose(V0.set(o.x, 0, o.z), Q.identity(), S3.set(o.w, o.h * f, D));
    city.setMatrixAt(j, M4); }); city.instanceMatrix.needsUpdate = true; }
const city = blocks(toks);

// ---- ground: one slab per column, a sidewalk per line, the unrendered void around ----
const gMat = new R.MeshStandardMaterial({ color: '#57504a', roughness: 0.92 });
const wMat = new R.MeshStandardMaterial({ color: '#c2b29f', roughness: 0.95 });
for (let k = 0; k < NC; k++) { const n = Math.min(PER, N - k * PER); if (n <= 0) break;
  const m = new R.Mesh(new R.BoxGeometry(CP - 14, 0.3, n * P), gMat);
  m.position.set(X0(k) + (CP - 14) / 2 - 2, -0.15, ZR(0) - P / 2 + n * P / 2);
  m.receiveShadow = true; scene.add(m); }
const walks = [];
LN.forEach((s, i) => { const a = s.search(/\S/); if (a < 0) return;
  walks.push([X0(i / PER | 0) + (a + s.length) / 2, ZR(i % PER), s.length - a + 0.9]); });
const walk = new R.InstancedMesh(new R.BoxGeometry(1, 0.05, D + 0.9), wMat, walks.length);
walks.forEach(([x, z, w], j) => walk.setMatrixAt(j, M4.makeTranslation(x, 0.025, z).scale(S3.set(w, 1, 1))));
walk.receiveShadow = true; walk.frustumCulled = false; scene.add(walk);
const gc = document.createElement('canvas'); gc.width = gc.height = 128;
const gx = gc.getContext('2d'); gx.fillStyle = '#0d1015'; gx.fillRect(0, 0, 128, 128);
gx.fillStyle = '#263042'; gx.fillRect(0, 0, 128, 3); gx.fillRect(0, 0, 3, 128);
const gt = new R.CanvasTexture(gc); gt.wrapS = gt.wrapT = R.RepeatWrapping; gt.repeat.set(3000, 3000);
gt.anisotropy = 8; gt.encoding = R.sRGBEncoding;
const voidM = new R.Mesh(new R.PlaneGeometry(3000, 3000), new R.MeshBasicMaterial({ map: gt }));
voidM.rotation.x = -Math.PI / 2; voidM.position.y = -0.3; scene.add(voidM);

// ---- sky and sun ----
const sky = new R.Mesh(new R.SphereGeometry(2500, 32, 16), new R.ShaderMaterial({
  side: R.BackSide, depthWrite: false, fog: false, uniforms: { uS: { value: SUN }, uH: { value: HZ } },
  vertexShader: 'varying vec3 vD;void main(){vD=normalize(position);' +
    'gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `uniform vec3 uS, uH; varying vec3 vD; void main() {
    float y = vD.y, s = max(dot(vD, uS), 0.);
    vec3 c = mix(uH, vec3(.1, .2, .48), smoothstep(.0, .5, y));
    c += vec3(1., .5, .2) * pow(s, 6.) * .9 + vec3(1., .8, .5) * pow(s, 900.) * 30.;
    c = mix(c, uH * .8, smoothstep(0., -.08, y));
    gl_FragColor = vec4(c, 1.);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }` }));
sky.renderOrder = -1; scene.add(sky);
scene.add(new R.HemisphereLight(0xffcfb0, 0x6a4a3a, 0.5));
const sun = new R.DirectionalLight(0xffb27a, 3.6); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// ---- people: the same body for everyone, #48 gets a hoodie ----
const LEG = new R.BoxGeometry(0.042, 0.16, 0.046).translate(0, -0.08, 0);
const ARM = new R.BoxGeometry(0.03, 0.14, 0.032).translate(0, -0.07, 0);
const BODY = new R.CylinderGeometry(0.05, 0.066, 0.18, 12).translate(0, 0.25, 0);
const HEAD = new R.SphereGeometry(0.056, 16, 12);
const mat = c => new R.MeshStandardMaterial({ color: c, roughness: 0.8 });
const hero = new R.Group();
const part = (geo, m, x, y, z, p) => { const o = new R.Mesh(geo, m); o.position.set(x, y, z);
  o.castShadow = true; p.add(o); return o; };
const piv = (x, y) => { const p = new R.Group(); p.position.set(x, y, 0); hero.add(p); return p; };
const hoodie = mat('#ff6a13'), jeans = mat('#283452'), skinM = mat('#dfa47f');
const hipL = piv(-0.03, 0.16), hipR = piv(0.03, 0.16), shL = piv(-0.076, 0.32), shR = piv(0.076, 0.32);
part(LEG, jeans, 0, 0, 0, hipL); part(LEG, jeans, 0, 0, 0, hipR); part(BODY, hoodie, 0, 0, 0, hero);
part(ARM, hoodie, 0, 0, 0, shL); part(ARM, hoodie, 0, 0, 0, shR);
const neck = piv(0, 0.34); neck.rotation.order = 'YXZ'; part(HEAD, skinM, 0, 0.055, 0, neck);
const hood = part(new R.SphereGeometry(0.063, 16, 12, Math.PI / 2 + 0.9, Math.PI * 2 - 1.8, 0, 2),
  hoodie, 0, 0.058, -0.008, neck); hood.material = hoodie.clone(); hood.material.side = R.DoubleSide;
const eye = new R.SphereGeometry(0.0095, 8, 6), ink = mat('#111');
part(eye, ink, -0.021, 0.066, 0.05, neck); part(eye, ink, 0.021, 0.066, 0.05, neck);
hero.rotation.order = 'YXZ'; scene.add(hero);
const LANES = [];
const lane = (z, dir, a, b, sp, ph = 0) => { const n = Math.floor((b - a) / sp);
  const l = { z, dir, a, L: n * sp, sp, ph, n }; LANES.push(l); return l; };
const HL = lane(ZH, 1, AX - 24, AX + 30, 0.8);   // the route #48 walks every day
HL.ih = Math.round((XH0 - HL.a) / 0.8); HL.ph = XH0 - HL.a - HL.ih * 0.8;
lane(ZS - 0.72, -1, AX - 24, AX + 30, 0.9);
for (let r = Math.max(1, RT - 12); r < RT; r++) for (const s of [-1, 1])
  lane(ZR(r) - P / 2 + s * 0.72, s, XT - 1, XT + 105, 3.1, r * 0.37);
if (KT > 0) for (let r = PER - 10; r < PER; r++) for (const s of [-1, 1])
  lane(ZR(r) - P / 2 + s * 0.72, s, X0(KT - 1) - 1, X0(KT - 1) + 105, 3.1, r * 0.53);
const NP = LANES.reduce((a, l) => a + l.n, 0);
const inst = (geo, c, n) => { const m = new R.InstancedMesh(geo, mat(c), n);
  m.castShadow = true; m.frustumCulled = false; scene.add(m); return m; };
const cBody = inst(BODY, '#868b92', NP), cHead = inst(HEAD, '#ffffff', NP);
const cLeg = inst(LEG, '#3a3f47', NP * 2), cArm = inst(ARM, '#868b92', NP * 2);
const SKIN = ['#e0ae8f', '#c98e6b', '#8d5a3e', '#f0c6a8'].map(c => new R.Color(c));
for (let j = 0; j < NP; j++) cHead.setColorAt(j, SKIN[(hash(j * 3.1) * 4) | 0]);
const B = new R.Matrix4(), T4 = new R.Matrix4(), RX = new R.Matrix4();
const limb = (im, j, x, y, a) => im.setMatrixAt(j, M4.copy(B).multiply(T4.makeTranslation(x, y, 0))
  .multiply(RX.makeRotationX(a)));
function pose(j, x, z, yaw, sw, hide) {
  if (hide) B.makeScale(0, 0, 0); else B.makeRotationY(yaw).setPosition(x, Math.abs(sw) * 0.02, z);
  cBody.setMatrixAt(j, B); cHead.setMatrixAt(j, M4.copy(B).multiply(T4.makeTranslation(0, 0.395, 0)));
  limb(cLeg, 2 * j, -0.03, 0.16, sw); limb(cLeg, 2 * j + 1, 0.03, 0.16, -sw);
  limb(cArm, 2 * j, -0.076, 0.32, -sw * 0.8); limb(cArm, 2 * j + 1, 0.076, 0.32, sw * 0.8);
}
function crowd(t, hx) {
  const sw = Math.sin(V * t / 0.5 * Math.PI * 2) * 0.55; let j = 0;
  for (const l of LANES) for (let i = 0; i < l.n; i++, j++) {
    const x = l.a + (((i * l.sp + l.ph + l.dir * V * t) % l.L) + l.L) % l.L;
    const z = l === HL && t > 0.6 ? l.z - 0.4 * sst(0.8, 0, Math.abs(x - hx)) : l.z;
    pose(j, x, z, l.dir * Math.PI / 2, sw, l === HL && i === l.ih);
  }
  for (const m of [cBody, cHead, cLeg, cArm]) m.instanceMatrix.needsUpdate = true;
}

// ---- #48's day, in seconds ----
function path(t) {
  let x = AX, z = ZH;
  if (t < 0.6) x = XH0 + V * t;
  else if (t < 0.85) { const u = t - 0.6; x = XH0 + V * 0.6 + V * u - 0.9 * u * u; }
  else if (t < 4) x = XS;
  else if (t < 10) x = mix(XS, AX, trap(lin(4, 10, t), 0.12));
  else if (t < 10.5) x = AX;
  else if (t < 23.8) z = mix(ZH, ZT + 1.85, trap(lin(10.5, 14.6, t), 0.15));
  else if (t < 25.25) z = mix(ZT + 1.85, ZN + 1.5, trap(lin(23.8, 25, t), 0.25));
  else { z = ZN + 1.5; x = mix(AX, XE, trap(lin(25.25, 32.2, t), 0.08)); }
  return [x, z];
}
const HT = [];
{ let ph = 0, [px, pz] = path(0);
  for (let i = 0; i <= DUR * 120; i++) {
    const [x, z] = path(i / 120), d = Math.hypot(x - px, z - pz), s = d * 120, run = sst(0.9, 1.8, s);
    ph += d / mix(0.5, 1, run) * Math.PI * 2;
    HT.push({ x, z, ph, run, amp: Math.min(1, s / 0.35) * mix(0.55, 0.95, run) }); px = x; pz = z;
  } }
const QP = Math.PI / 2;
function yawAt(t) {
  if (t < 3.4) return QP;
  if (t < 10) return mix(QP, -QP, sst(3.4, 4, t));
  if (t < 25) return mix(-QP, 0, sst(10, 10.5, t));
  if (t < 32.3) return mix(0, QP, sst(25, 25.25, t));
  return mix(QP, 0, sst(32.3, 32.8, t));
}
const heroAt = t => { const h = HT[Math.min(HT.length - 1, Math.round(t * 120))];
  return Object.assign({ yaw: yawAt(t), sw: Math.sin(h.ph) * h.amp }, h); };
const lookW = t => sst(1, 1.1, t) * (1 - sst(3.3, 3.6, t)) + sst(15, 15.6, t) * (1 - sst(23.6, 24, t))
  + sst(32.6, 33, t);
function poseHero(H, t) {
  hero.position.set(H.x, Math.abs(H.sw) * 0.016, H.z); hero.rotation.set(0.2 * H.run, H.yaw, 0);
  hipL.rotation.x = H.sw; hipR.rotation.x = -H.sw;
  shL.rotation.set(-H.sw * 0.9, 0, 0); shR.rotation.set(H.sw * 0.9, 0, 0);
  const wv = sst(33.2, 33.6, t); if (wv > 0) shR.rotation.set(0, 0, wv * (2.7 + Math.sin(t * 9) * 0.3));
  hero.updateMatrixWorld(true); const lw = lookW(t), np = neck.getWorldPosition(V0);
  const dx = cam.position.x - np.x, dy = cam.position.y - np.y - 0.05, dz = cam.position.z - np.z;
  let a = Math.atan2(dx, dz) - H.yaw; a = Math.atan2(Math.sin(a), Math.cos(a));
  neck.rotation.set(-clamp(Math.atan2(dy, Math.hypot(dx, dz)), -0.7, 1) * lw, clamp(a, -1.3, 1.3) * lw, 0);
}

// ---- the same car, every time ----
const car = new R.Group(), cpart = (w, h, d, c, x, y, o = {}) => { const m = new R.Mesh(
  new R.BoxGeometry(w, h, d), new R.MeshStandardMaterial(Object.assign({ color: c, roughness: .35 }, o)));
  m.position.set(x, y, 0); m.castShadow = true; car.add(m); return m; };
cpart(0.95, 0.16, 0.42, '#ff3b2b', 0, 0.15, { metalness: 0.1 }); cpart(0.5, 0.13, 0.38, '#1d2633', -0.05, 0.28);
cpart(0.02, 0.04, 0.34, '#fff4d6', 0.48, 0.16, { emissive: '#ffe2a8', emissiveIntensity: 2 });
const wheel = new R.CylinderGeometry(0.075, 0.075, 0.06, 16).rotateX(QP);
for (const [x, z] of [[-0.3, -0.2], [-0.3, 0.2], [0.3, -0.2], [0.3, 0.2]]) {
  const w = new R.Mesh(wheel, mat('#15171a')); w.position.set(x, 0.075, z); car.add(w); }
scene.add(car);
function carAt(t) { car.visible = false;
  for (const tc of [5.3, 8.7]) if (Math.abs(t - tc) < 2.2) {
    car.visible = true; car.position.set(path(tc)[0] + 4.2 * (t - tc), 0, ZS - 0.1); } }

// ---- the line he writes ----
const NT = [['leave(him);', 16, 0, 3.4], ['//', 28, 4, 1.2], ['done', 31, 4, 1.7]].map(([t, s, c, h], j) =>
  ({ t, s, e: s + t.length, c, h, i: N + j, k: KT, z: ZN, x: XT + s + t.length / 2, w: t.length - .25 }));
const nl = blocks(NT);
const slab = new R.Mesh(new R.BoxGeometry(1, 0.3, 4), gMat); slab.receiveShadow = true; scene.add(slab);
let typed = 0;
function newLine(t, H) {
  typed = t < 25.25 ? 0 : clamp(Math.ceil(H.x - XT - 16), 0, 19);
  const w = Math.max(1.6, typed + 1.4), rise = sst(32.4, 34.2, t);
  slab.visible = t > 23.8; slab.scale.x = w; slab.position.set(XT + 15.7 + w / 2, -0.15, ZT + 4);
  nl.list.forEach((o, j) => { const on = typed >= o.e - 16 ? 1 : 0;
    M4.compose(V0.set(o.x, 0, o.z), Q.identity(), S3.set(o.w * on, o.h * mix(0.04, 1, rise) * on, D * on));
    nl.setMatrixAt(j, M4); }); nl.instanceMatrix.needsUpdate = true;
}

// ---- camera: one shot per beat ----
function crane(Pa, Qa, Pb, Qb, e) {
  const h = Pa.y * Math.pow(Pb.y / Pa.y, e), f = (h - Pa.y) / (Pb.y - Pa.y);
  return [Pa.clone().lerp(Pb, f), Qa.clone().lerp(Qb, f)];
}
const d1p = v3(AX - 0.7, 0.22, ZT + 3.7), d1q = v3(AX, 0.3, ZT + 1.85), Pa = d1p.clone().lerp(d1q, 0.15);
const Pb = v3(CX, 650, 30), Qb = v3(CX, 0, 0), Pc = v3(XT + 12, 15, ZT + 13), Qc = v3(XT + 12, 0, ZT + 0.3);
const endE = t => { const H = heroAt(t); return [v3(H.x - 3, 6.5, ZN + 8), v3(H.x + 1.2, 0, ZN + 0.4)]; };
function shot(t, H) {
  if (t < 4) { const q = v3(H.x, 0.3, ZH), p = v3(XH0 + 2 - 0.1 * t, 0.3, ZS - 0.2);
    return [p.lerp(q, sst(1, 3.6, t) * 0.35), q, 32]; }
