// ---------- people ----------
const SHIRT=['#3f5e73','#d9a441','#7d9a6a','#c96a4b','#ece6da','#4a4a48','#6f8fa6'],SKIN=['#f1c9a5','#e0ac83','#c68863','#8d5a3b','#5c3a26'];
function person(sh,sk){const g=new T3.Group(),mt=c=>new T3.MeshStandardMaterial({color:c,roughness:.8});
  const legs=new T3.Mesh(new T3.CylinderGeometry(.16,.13,.85,8).translate(0,.43,0),mt('#2f3138'));const body=new T3.Mesh(new T3.CylinderGeometry(.21,.17,.7,10).translate(0,1.2,0),mt(sh));

function profile(pts){const s=new T3.Shape();s.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++){const p=pts[i];if(p.length===4)s.quadraticCurveTo(p[0],p[1],p[2],p[3]);else s.lineTo(p[0],p[1]);}return s;}

const ME=makeCar(false),BOT=makeCar(true);

// ---------- the scene's script: speeds in m/s, integrated once ----------
const DT=1/240,STOPZ=-150,PZ=STOPZ-1.2,TMAX=26;
function integrate(fn){const n=Math.ceil(TMAX/DT)+2,s=new Float32Array(n),v=new Float32Array(n);let S=0,Vv=0;for(let i=0;i<n;i++){const t=i*DT;Vv=fn(t,S,Vv);S+=Vv*DT;s[i]=S;v[i]=Vv;}return{s,v};}

const LOOP=+(PT+3.4).toFixed(2),MPH=K=>Math.round(Math.max(...K.v.slice(0,Math.round(PT/DT)))*2.237);

function stateAt(t){
  const [sm_,vm]=look(meK,t),[sb,vb]=look(botK,t),brake=t>TB&&vm>.2;
  const slide=sm(TB,TB+.55,t)*(1-sm(TB+2,TB+3.2,t));
  const me={x:-1.75+.55*Math.sin((t-TB)*2.3)*slide,z:-sm_+2,yaw:.07*Math.sin((t-TB)*3.1)*slide,v:vm,acc:accOf(meK,t),brake,s:sm_};
  const pull=sm(110,146,sb);const bot={x:1.75+.85*pull,z:-sb+2,yaw:-.05*(sm(110,128,sb)-sm(128,146,sb)),v:vb,acc:accOf(botK,t),brake:vb<16.9&&sb>90,s:sb};
  return{me,bot};
}
function placeCar(C,st,t){C.g.position.set(st.x,0,st.z);C.g.rotation.y=Math.PI/2+st.yaw;C.body.rotation.z=clamp(st.acc*.006,-.06,.06);C.body.position.y=.02*Math.sin(t*11)*Math.min(1,st.v/20);
  for(const w of C.wheels){w.w.rotation.z=-st.s/.36;if(w.front)w.p.rotation.y=-st.yaw*1.5;}
  C.body.children.forEach(m=>{if(m.material&&m.material.emissive&&m.material.emissive.r>.9&&m.material.emissive.g<.3)m.material.emissiveIntensity=st.brake||st.v<.1?4:1;});
  if(C.g.userData.dome)C.g.userData.dome.rotation.y=t*8;}
const pax=person('#d9a441','#c68863');pax.position.set(4.3,.16,PZ);pax.rotation.y=-Math.PI/2;
function placePax(t,bz){const arm=pax.userData.arm;const got=t>PT;arm.rotation.z=got?.1:Math.PI-.4+.35*Math.sin(t*9);
  const k=sm(PT,PT+1.1,t);pax.position.set(lerp(4.3,3.2,k),.16*(1-k),lerp(PZ,bz+.3,k));pax.visible=t<PT+1.2;}

// ---------- smoke from my tyres (launch and the late stop) ----------
const smokeTex=tex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.6,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);});
const NSM=420,smGeo=new T3.InstancedBufferGeometry().copy(new T3.PlaneGeometry(1,1));const aA=new T3.InstancedBufferAttribute(new Float32Array(NSM),1);smGeo.setAttribute('aA',aA);
const smMat=new T3.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{map:{value:smokeTex}},vertexShader:'attribute float aA;varying float vA;varying vec2 vU;void main(){vA=aA;vU=uv;gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(position,1.);}',
  fragmentShader:'uniform sampler2D map;varying float vA;varying vec2 vU;void main(){float a=texture2D(map,vU).a*vA;gl_FragColor=vec4(vec3(1.25,1.18,1.1)*.9,a);}'});
const smoke=new T3.InstancedMesh(smGeo,smMat,NSM);smoke.frustumCulled=false;scene.add(smoke);
const EMIT=[];for(let te=0;te<1.3;te+=1/40)EMIT.push([te,0]);for(let te=TB;te<TB+2.85;te+=1/40)EMIT.push([te,1]);
const so=new T3.Object3D();
function placeSmoke(t){let n=0;const cq=cam.quaternion;
  for(const [te,kind] of EMIT){if(te>t)break;const age=t-te,life=kind?3.2:2.4;if(age>life)continue;const st=stateAt(te).me;
    for(const side of [-.86,.86]){if(n>=NSM)break;const h=(te*977+side*13)%1,rx=st.x+side+(h-.5)*.6,rz=st.z+(kind?1.3:1.42)+age*(1.4+h)*(kind?.35:1),ry=.3+age*(.5+h*.4);
      so.position.set(rx+age*(h-.5)*1.4,ry,rz);so.quaternion.copy(cq);so.scale.setScalar(.8+age*(1.6+h)*(kind?1.4:1));so.updateMatrix();smoke.setMatrixAt(n,so.matrix);aA.setX(n,(kind?.42:.28)*(1-age/life)*Math.min(1,age*6));n++;}}
  smoke.count=n;smoke.instanceMatrix.needsUpdate=true;aA.needsUpdate=true;}

// ---------- post: speed blur, ACES, grade, grain, vignette ----------
const post=new T3.Scene(),pcam=new T3.OrthographicCamera(-1,1,1,-1,0,1);
const pmat=new T3.ShaderMaterial({uniforms:{t:{value:null},spd:{value:0},seed:{value:0},res:{value:new T3.Vector2(1,1)}},
  vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`uniform sampler2D t;uniform float spd,seed;uniform vec2 res;varying vec2 vU;
  vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
  void main(){vec2 c=vU-.5;float r=length(c);vec3 col=vec3(0.);float w=0.;
   for(int i=0;i<9;i++){float k=float(i)/8.;vec2 o=c*(1.-k*spd*.045*smoothstep(.12,.6,r));col+=texture2D(t,.5+o).rgb;w+=1.;}col/=w;
   col=aces(col*.62);col=pow(col,vec3(1./2.2));col=mix(vec3(dot(col,vec3(.299,.587,.114))),col,1.08);col*=vec3(1.03,1.,.96);
   col*=1.-r*r*.55;float g=fract(sin(dot(vU*res+seed,vec2(12.9898,78.233)))*43758.5453);col+=(g-.5)*.035;gl_FragColor=vec4(col,1.);}`,depthTest:false,depthWrite:false});
post.add(new T3.Mesh(new T3.PlaneGeometry(2,2),pmat));

// ---------- camera script ----------
const SH=[[0,'launch'],[2.1,'chase'],[3.9,'front'],[5.9,'chaseLow'],[TB-.1,'curb'],[PT+1.3,'crane'],[LOOP,'crane']];
function poseOf(k,t,S){const m=S.me,b=S.bot;
  if(k==='launch')return[0,.85,m.z+8.5-t*1.2,0,.9,m.z-18];
  if(k==='chase')return[m.x+.9,1.75,m.z+7.2,m.x+.2,1.05,m.z-12];
  if(k==='front')return[m.x+2.1,1.05,m.z-10.5,(m.x+b.x)/2,.9,m.z+3];
  if(k==='chaseLow')return[m.x+1.3,1.2,m.z+6.2,m.x+1.5,1,m.z-14];
  if(k==='curb'){const u=sm(TB-.1,PT,t);return[4.5,2.2,STOPZ+15-u*4,lerp(-1.2,2.4,u),.9,lerp(STOPZ-12,STOPZ-1,u)];}
  const c=sm(PT+1.3,LOOP,t);return[lerp(4.4,2,c),lerp(2.3,9,c),STOPZ+11+c*7,0,.6,STOPZ-12];}
function camAt(t,S){let i=0;while(i<SH.length-2&&t>=SH[i+1][0])i++;const A=SH[i],B=SH[i+1];const pa=poseOf(A[1],t,S);let p=pa;
  if(B[1]!==A[1]&&t>B[0]-.35){const pb=poseOf(B[1],t,S),k=sm(B[0]-.35,B[0],t);p=pa.map((v,j)=>lerp(v,pb[j],k));}
  const sh=Math.min(1,S.me.v/25)*(A[1]==='curb'||A[1]==='crane'?0:1);cam.position.set(p[0]+Math.sin(t*37)*.02*sh,p[1]+Math.sin(t*53)*.015*sh,p[2]);cam.lookAt(p[3],p[4],p[5]);
  const blur=A[1]==='curb'||A[1]==='crane'?0:Math.min(1,S.me.v/24);return blur;}

// ---------- overlay ----------
const comp=document.createElement('canvas'),g2=comp.getContext('2d'),UIF='ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif';
// mission HUD: own design (no game UI copied): title card, minimap, objective, marker, result
const SUBS=[[2.6,5.4,'Pick up the passenger before the robot taxi.'],[5.6,TB-.2,'Passenger on the right. Slow down.'],[TB+.7,TB+2.6,'You missed the stop.']];
let S0=null,curT=0;
function txt(g,s,x,y,size,w,col,al,sh){g.font=w+' '+size+'px '+UIF;g.textAlign=al||'left';if(sh){g.shadowColor='rgba(0,0,0,.65)';g.shadowBlur=sh;g.shadowOffsetY=2;}g.fillStyle=col;g.fillText(s,x,y);g.shadowBlur=0;g.shadowOffsetY=0;g.shadowColor='transparent';}
function compose(t){const W=cv.width,H=cv.height,u=W/1080,g=g2;if(comp.width!==W||comp.height!==H){comp.width=W;comp.height=H;}
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.drawImage(cv,0,0);g.textBaseline='alphabetic';g.letterSpacing='0px';const m=S0.me,b=S0.bot;
  // money + clock, top right
  const cash=t>PT?0:0;txt(g,'$'+cash.toLocaleString('en-US'),W-44*u,82*u,52*u,'800','#9fe870','right',8*u);txt(g,'11:58 PM',W-44*u,120*u,24*u,'700','#ffffff','right',6*u);
  // minimap, bottom left: north up, follows my car, 1 px = 0.18 m
  const R=150*u,cx=44*u+R,cy=H-44*u-R,sc=1/.18*u*.6;g.save();g.beginPath();g.arc(cx,cy,R,0,7);g.clip();g.fillStyle='rgba(28,30,34,.82)';g.fillRect(cx-R,cy-R,2*R,2*R);
  const P=(x,z)=>[cx+(x-m.x)*sc,cy+(z-m.z)*sc];
  g.fillStyle='rgba(120,124,132,.9)';{const p=P(-3.5,0);g.fillRect(p[0],cy-R,7*sc,2*R);}for(const i of ixs){const p=P(0,i);g.fillRect(cx-R,p[1]-7*sc,2*R,14*sc);}
  g.fillStyle='rgba(70,74,82,.95)';for(const [a2,b2] of segs)for(const sd of [-1,1]){const p=P(sd>0?7.5:-25,a2);g.fillRect(p[0],p[1],17.5*sc,(b2-a2)*sc);}
  // route to the passenger
  if(t<PT){g.strokeStyle='#f5c542';g.lineWidth=6*u;g.beginPath();const p1=P(m.x,m.z),p2=P(3,PZ);g.moveTo(p1[0],p1[1]);g.lineTo(p1[0],p2[1]);g.lineTo(p2[0],p2[1]);g.stroke();}
  const dot=(x,z,c,r)=>{const p=P(x,z);g.fillStyle=c;g.beginPath();g.arc(p[0],p[1],r*u,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2*u;g.stroke();};
  if(pax.visible)dot(4.3,PZ,'#f5c542',11);dot(b.x,b.z,'#43d6c6',10);
  g.fillStyle='#ff6a4a';g.beginPath();g.moveTo(cx,cy-16*u);g.lineTo(cx+11*u,cy+12*u);g.lineTo(cx,cy+6*u);g.lineTo(cx-11*u,cy+12*u);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=2*u;g.stroke();
  g.restore();g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=3*u;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();txt(g,'N',cx,cy-R+26*u,18*u,'800','#fff','center',4*u);
  // speed under the map
  txt(g,Math.round(m.v*2.237)+' mph',cx+R+22*u,H-58*u,30*u,'800','#ffffff','left',8*u);txt(g,'robot taxi '+Math.round(b.v*2.237)+' mph',cx+R+22*u,H-96*u,20*u,'700','#7fe9dc','left',6*u);
  // marker over the passenger with the distance
  if(t<PT&&t>2.6){const v=new T3.Vector3(4.3,2.5,PZ).project(cam);if(v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1){const sx=(v.x*.5+.5)*W,sy=(-v.y*.5+.5)*H,d=Math.max(0,Math.round(Math.hypot(m.x-4.3,m.z-PZ)));
    g.fillStyle='#f5c542';g.beginPath();g.moveTo(sx-16*u,sy-26*u);g.lineTo(sx+16*u,sy-26*u);g.lineTo(sx,sy);g.closePath();g.fill();txt(g,d+' m',sx,sy-36*u,26*u,'800','#ffffff','center',8*u);}}
  // mission title over the launch
  {const a=sm(.05,.4,t)*(1-sm(2.1,2.6,t));if(a>0){g.globalAlpha=a;txt(g,'MISSION 1',W/2,H*.36,26*u,'800','#f5c542','center',10*u);txt(g,'The Last Fare',W/2,H*.36+78*u,84*u,'850','#ffffff','center',18*u);g.globalAlpha=1;}}
  // objective subtitles
  for(const c of SUBS){const a=sm(c[0],c[0]+.25,t)*(1-sm(c[1]-.25,c[1],t));if(a>0){g.globalAlpha=a;txt(g,c[2],W/2,H-382*u,36*u,'750','#ffffff','center',10*u);g.globalAlpha=1;}}
  // result
  {const a=sm(PT+.15,PT+.5,t);if(a>0){g.globalAlpha=a;g.fillStyle='rgba(0,0,0,.42)';g.fillRect(0,H*.31,W,H*.24);txt(g,'MISSION FAILED',W/2,H*.43,92*u,'850','#ff4a3a','center',18*u);
    txt(g,'The robot taxi got there first.',W/2,H*.43+62*u,34*u,'700','#ffffff','center',8*u);g.globalAlpha=1;}}
  {const a=sm(PT+1.6,PT+1.9,t);if(a>0){g.globalAlpha=a;txt(g,"Faster isn't first.",W/2,H-382*u,40*u,'800','#ffffff','center',10*u);g.globalAlpha=1;}}
  g.globalAlpha=.85;txt(g,'built with Claude Opus 5.5 · 1 file · '+((window.__fileBytes||0)/1024).toFixed(1)+' KB · no images, no models',W-44*u,H-30*u,16*u,'600','#ffffff','right',6*u);
  txt(g,'scripted scene',W-44*u,H-56*u,16*u,'600','#ffffff','right',6*u);g.globalAlpha=1;g.textAlign='left';}

// ---------- frame ----------
let vw=1,vh=1;
function resize(){vw=innerWidth;vh=innerHeight;renderer.setSize(vw,vh,false);cam.aspect=vw/vh;cam.fov=vw/vh<.8?52:38;cam.updateProjectionMatrix();const s=renderer.getDrawingBufferSize(new T3.Vector2());makeRT(s.x,s.y);pmat.uniforms.res.value.copy(s);}
function draw(t){
  t=mod(t,LOOP);curT=t;const S=stateAt(t);S0=S;placeCar(ME,S.me,t);placeCar(BOT,S.bot,t);placePax(t,S.bot.z);
  for(const w of walkers){const z=mod(w.z+w.v*t-(Z0-LEN+40),LEN-60)+Z0-LEN+40;w.p.position.set(w.x,.16,z);w.p.rotation.y=w.v>0?0:Math.PI;w.p.position.y=.16+Math.abs(Math.sin(t*6+w.ph))*.04;w.p.userData.arm.rotation.x=Math.sin(t*6+w.ph)*.4;}
  const blur=camAt(t,S);placeSmoke(t);skyMat.uniforms.t.value=t;
  const fz=(S.me.z+S.bot.z)/2-15;sunL.target.position.set(0,0,fz);sunL.position.copy(SUN).multiplyScalar(-1).multiplyScalar(-120).add(V3(0,0,fz));sunL.position.y=Math.abs(sunL.position.y)+40;
  sky.position.copy(cam.position);pmat.uniforms.spd.value=blur;pmat.uniforms.seed.value=Math.floor(t*30)*1.37;
  renderer.info.reset();renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);pmat.uniforms.t.value=rt.texture;renderer.render(post,pcam);
}
let REC=false;const t0=performance.now();
function frame(now){if(REC)return;draw((now-t0)/1000);requestAnimationFrame(frame);}
window.__duration=LOOP;
window.__seek=t=>{REC=true;draw(t);return true;};
window.__comp=comp;
window.__frame=t=>{window.__seek(t);compose(mod(t,LOOP));return comp.toDataURL('image/png');};
window.__frameNoData=t=>{window.__seek(t);compose(mod(t,LOOP));return true;};
// per-frame state for the sound track (same keys as build 03)
window.__tl=()=>{const t=curT,m=S0.me,b=S0.bot,fr=m.v/25,GR=[0,.27,.5,.74,1.2];let gi=1;while(gi<4&&fr>GR[gi])gi++;const w=(fr-GR[gi-1])/(GR[gi]-GR[gi-1]),thr=t>.2&&t<TB?1:0;
  const rpm=t<.45?(t>.15?5200:1000):m.brake?1100+3000*fr:1000+5300*(gi===1?w:.42+.58*w);const slip=t<1.25?.8:t>TB&&t<11.8?.9*Math.min(1,m.v/8+.2):0;
  const ev=[];if(Math.abs(t-PT)<1/60)ev.push('fare:bot','fail');if(Math.abs(t-.1)<1/60)ev.push('title');if(window.__lastGear!==gi&&t<9){if(window.__lastGear)ev.push('shift:me');}window.__lastGear=gi;
  return{meV:+fr.toFixed(3),meT:thr,meB:m.brake?1:0,meRpm:Math.round(rpm),meGear:gi,meSlip:slip,botV:+(b.v/9).toFixed(3),botSlip:0,dist:+(Math.hypot(b.x-m.x,b.z-m.z)/4).toFixed(3),ev};};
window.__info=()=>({TB,PT,LOOP,calls:renderer.info.render.calls,tris:renderer.info.render.triangles});
resize();addEventListener('resize',resize);
(async()=>{try{const r=await fetch(location.href.split('#')[0],{cache:'force-cache'});window.__fileBytes=(await r.blob()).size;}catch(_){}})();
draw(0);window.__ready=true;requestAnimationFrame(frame);
})();
</script>
