<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pocket Vice 02 · Robot Shift</title>
<meta name="description" content="A tiny city in one HTML file. Drag the slider to hand its jobs to robots and watch what the day turns into. Toy model.">
<meta name="theme-color" content="#e9e2d3">
<style>
:root{--ink:#2b2a27;--muted:#7a7468;--accent:#ff5a36;--card:rgba(251,248,241,.94)}
html,body{margin:0;height:100%;overflow:hidden;background:#e9e2d3;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;box-sizing:border-box;transition:color .6s}
body.night #hud{color:#f4eee3}
body.night{--muted:#b9b2a5}
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand b{display:block;font-size:10.5px;letter-spacing:.2em;font-weight:800;opacity:.8}
.brand span{display:block;font-size:16px;font-weight:750;margin-top:2px}
#pop{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
#clock{pointer-events:auto;text-align:right;cursor:pointer}
#time{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
#time small{font-size:13px;font-weight:700;margin-left:3px;letter-spacing:0}
#spd{display:inline-block;margin-top:6px;font-size:11px;font-weight:750;padding:3px 9px;border-radius:99px;background:rgba(43,42,39,.09)}
body.night #spd{background:rgba(255,255,255,.14)}
#mid{flex:1}
#hint{align-self:center;font-size:14px;font-weight:650;padding:9px 15px;border-radius:99px;background:var(--card);color:var(--ink);box-shadow:0 6px 20px rgba(40,30,20,.12);margin-bottom:10px;transition:opacity .4s}
#hint i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px;animation:pu 1.4s infinite}
@keyframes pu{50%{transform:scale(1.6);opacity:.5}}
#card{align-self:center;width:min(420px,100%);box-sizing:border-box;background:var(--card);color:var(--ink);border-radius:20px;padding:14px 16px 13px;box-shadow:0 10px 34px rgba(40,30,20,.18);margin-bottom:10px;pointer-events:auto;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
#card.hide{transform:translateY(24px);opacity:0;pointer-events:none}
.ch{display:flex;align-items:center;gap:11px}
#cAv{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 0 0 2px var(--accent)}
.cn{flex:1;min-width:0}

.cn span{display:block;font-size:12px;color:#7a7468;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cX{pointer-events:auto;border:0;background:rgba(43,42,39,.07);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:30px;padding:0;color:var(--ink);cursor:pointer}
#cNow{margin:11px 0 9px;font-size:14px;font-weight:680}

.tl{position:relative;height:14px}
#cBar{width:100%;height:14px;display:block;border-radius:7px}

#cMeet{margin-top:9px;font-size:12.5px;color:#5e594f;display:flex;gap:6px;flex-wrap:wrap}
#cMeet span{background:rgba(43,42,39,.06);border-radius:99px;padding:3px 9px}
#cMeet span.a{background:rgba(255,90,54,.12);color:#c23d1f;font-weight:700}
#foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;gap:10px}
#sig{opacity:.72;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.01em}

body.night #seed{background:rgba(255,255,255,.14)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:14px}
body.rec #hint{opacity:0}
#panel{align-self:center;width:min(420px,100%);box-sizing:border-box;background:var(--card);color:var(--ink);border-radius:20px;padding:11px 16px 10px;box-shadow:0 10px 34px rgba(40,30,20,.18);margin-bottom:8px;pointer-events:auto}
#pl{display:flex;align-items:baseline;gap:7px;font-size:11px;font-weight:800;letter-spacing:.1em;white-space:nowrap}

#rng::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p),rgba(43,42,39,.13) var(--p))}
#rng::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--accent) var(--p),rgba(43,42,39,.13) var(--p))}
#rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 2px 6px rgba(40,30,20,.25)}
#rng::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--accent)}
#st{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:12px;color:#5e594f;margin-top:5px;font-variant-numeric:tabular-nums}
#st b{color:var(--ink)}#st i{font-style:normal;color:#c23d1f;font-weight:700}
#pf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:#9a9385}
#ubi{pointer-events:auto;font:inherit;font-size:11.5px;font-weight:750;border:0;border-radius:99px;padding:5px 11px;background:rgba(43,42,39,.09);color:var(--ink);cursor:pointer}
#ubi.on{background:var(--accent);color:#fff}
body.rec #card{display:none}
body.rec *{transition:none!important;animation:none!important}
</style>

<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="top">
    <div class="brand"><b>POCKET VICE</b><span>02 · Robot Shift</span><div id="pop"></div></div>
    <div id="clock" title="Tap to change speed"><div id="time">7:00<small>AM</small></div><div id="spd">×1</div></div>
  </div>
  <div id="mid"></div>
  <div id="hint"><i></i>Drag the slider. Tap anyone.</div>
  <div id="card" class="hide">
    <div class="ch"><i id="cAv"></i><div class="cn"><b id="cName"></b><span id="cRole"></span></div><button id="cX" aria-label="Close">×</button></div>
    <div id="cNow"></div>
    <div class="tl"><canvas id="cBar" width="400" height="14"></canvas><i id="cHead"></i></div>
    <div class="tk"><span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span></div>
    <div id="cMeet"></div>
  </div>
  <div id="panel">
    <div id="pl"><span>ROBOTS DO</span><b id="pct">0%</b><span>OF JOBS</span><em id="split"></em></div>
    <input id="rng" type="range" min="0" max="100" value="40" aria-label="Share of jobs done by robots">
    <div id="st"></div>
    <div id="pf"><button id="ubi">UBI: off</button><span>toy model · my assumptions</span></div>
  </div>
  <div id="foot"><span id="sig">1 file</span><button id="seed"></button></div>
</div>
<div id="err">Could not load three.js from the CDN.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').style.display='flex';return;}

// ---------- utils ----------
const Q=new URLSearchParams(location.search);
let SEED=parseInt(Q.get('seed'),10); if(!(SEED>=0)) SEED=7;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry(Math.imul(SEED+1,2654435761)^0x9e3779b9);
const rf=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rf(a,b+1)), pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(x,a,b)=>x<a?a:x>b?b:x, sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}, mod=(a,n)=>((a%n)+n)%n, lerp=(a,b,t)=>a+(b-a)*t;
const H=h=>h*60;

// ---------- city layout ----------
const NB=5,BS=3,ST=BS+1,G=NB*ST+1,DAY=1440,FH=.42;
const isRoad=(x,z)=>x>=0&&z>=0&&x<G&&z<G&&(x%ST===0||z%ST===0);
const W=c=>c-G/2+.5;
const HOME=0,WORK=1,CAFE=2,SHOP=3,PARK=4;
const AVES=shuffle(['Elm','Birch','Maple','Cedar','Alder','Linden','Willow','Hazel','Aspen','Juniper','Poplar','Spruce']).slice(0,NB+1).map(n=>n+' Ave');
const STS=['1st St','2nd St','3rd St','4th St','5th St','6th St'];
const CAFES=shuffle(['Little Crumb','Corner Cup','Morning Room','Two Spoons','Paper Moon','Sugar & Salt','Slow Drip','The Bread Box','Half Moon Bagels','Tiny Teapot']);
const SHOPS=shuffle(['Corner Market','Page Turner Books','Fix-It Hardware','Bloom Florist','Fresh Pick Grocer','Tape & Thread','Pocket Pharmacy','Second Spin Records']);
const OFFS=shuffle(['Ledger & Co','Northwind Studio','Atlas Insurance','Brightline Labs','Kettle Media','Parcel Post','City Records','Greenleaf Bank','Copperpot Design','Harlow Law','Bluefield Clinic','Fernway Tech','Quarry Press','Tallow Architects','Moss & Pine','Lantern Games']);
const PARKN=shuffle(['Willow Park','Juniper Green','Hazel Square','Linden Commons','Orchard Park']);
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

const blocks=[],places=[],trees=[];
const cen=(NB-1)/2;
for(let bz=0;bz<NB;bz++)for(let bx=0;bx<NB;bx++){
  const d=Math.max(Math.abs(bx-cen),Math.abs(bz-cen));
  blocks.push({bx,bz,d,type:d===0?'down':d===1?(R()<.55?'down':'res'):'res'});
}
{ // parks: one inner, one outer (sometimes the centre)
  const inner=blocks.filter(b=>b.d===1), outer=blocks.filter(b=>b.d===2);
  if(R()<.35) blocks.find(b=>b.d===0).type='park'; else pick(inner).type='park';
  pick(outer).type='park';
}
const counters={o:0,c:0,s:0,p:0};
function streetOf(rx,rz,dir){return dir[0]!==0?AVES[rx/ST]:STS[rz/ST];}
function mkPlace(kind,cx,cz,extra){const p=Object.assign({id:places.length,kind,cx,cz,x:W(cx),z:W(cz),staff:0},extra);places.push(p);return p;}
for(const b of blocks){
  const x0=b.bx*ST+1,z0=b.bz*ST+1;
  if(b.type==='park'){
    const cx=x0+1,cz=z0+1,doors=[];
    for(const dr of DIRS){const ex=cx+dr[0]*2,ez=cz+dr[1]*2;doors.push({d:[W(cx)+dr[0]*1.47,W(cz)+dr[1]*1.47],rc:[ex,ez]});}
    b.place=mkPlace(PARK,cx,cz,{doors,name:PARKN[counters.p++%PARKN.length],pond:R()<.5});
    const n=ri(7,10);
    for(let i=0;i<n;i++){const a=R()*Math.PI*2,r=rf(.55,1.35);let tx=Math.cos(a)*r,tz=Math.sin(a)*r;if(Math.abs(tx)<.16)tx+=.3;if(Math.abs(tz)<.16)tz+=.3;trees.push([W(cx)+tx,W(cz)+tz,rf(.8,1.3)]);}
    continue;
  }
  const lots=[];
  for(let lz=0;lz<3;lz++)for(let lx=0;lx<3;lx++){
    if(lx===1&&lz===1){trees.push([W(x0+1)+rf(-.12,.12),W(z0+1)+rf(-.12,.12),rf(1,1.35)]);continue;}
    const c=[];if(lx===0)c.push([-1,0]);if(lx===2)c.push([1,0]);if(lz===0)c.push([0,-1]);if(lz===2)c.push([0,1]);
    lots.push({cx:x0+lx,cz:z0+lz,dir:pick(c)});
  }
  shuffle(lots);
  lots.forEach((l,i)=>{
    let kind=b.type==='down'?WORK:HOME;
    if(i===0&&(b.type==='down'?R()<.4:R()<.16))kind=CAFE;
    else if(i===1&&(b.type==='down'?R()<.25:R()<.22))kind=SHOP;
    const rc=[l.cx+l.dir[0],l.cz+l.dir[1]];
    const door=[W(l.cx)+l.dir[0]*.47,W(l.cz)+l.dir[1]*.47];
    const ex={dir:l.dir,doors:[{d:door,rc}],street:streetOf(rc[0],rc[1],l.dir)};
    if(kind===HOME){const apt=R()<(b.d===1?.45:.2);ex.floors=apt?ri(3,4):ri(1,2);ex.roof=!apt;ex.cap=apt?ri(4,7):ri(1,3);}
    else if(kind===WORK){ex.floors=b.d===0?ri(4,6):ri(3,5);ex.name=OFFS[counters.o%OFFS.length]+(counters.o>=OFFS.length?' Annex':'');counters.o++;ex.cap=ex.floors*2;}
    else if(kind===CAFE){ex.floors=1;ex.name=CAFES[counters.c++%CAFES.length];ex.cap=3;}
    else {ex.floors=ri(1,2);ex.name=SHOPS[counters.s++%SHOPS.length];ex.cap=2;}
    mkPlace(kind,l.cx,l.cz,ex);
  });
}
// guarantee at least 2 cafes and 1 shop
while(places.filter(p=>p.kind===CAFE).length<2){const h=pick(places.filter(p=>p.kind===HOME));h.kind=CAFE;h.floors=1;h.roof=false;h.cap=3;h.name=CAFES[counters.c++%CAFES.length];}
if(!places.some(p=>p.kind===SHOP)){const h=pick(places.filter(p=>p.kind===HOME));h.kind=SHOP;h.floors=1;h.roof=false;h.cap=2;h.name=SHOPS[0];}
const byKind=k=>places.filter(p=>p.kind===k);
const homes=byKind(HOME),offices=byKind(WORK),cafes=byKind(CAFE),shops=byKind(SHOP),parks=byKind(PARK);
const labelOf=p=>p.kind===HOME?'home on '+p.street:p.name;

// ---------- pathfinding on the road grid ----------
const prev=new Int32Array(G*G);
function bfs(s,e){
  prev.fill(-1);const si=s[1]*G+s[0],ei=e[1]*G+e[0];prev[si]=si;const q=[si];
  for(let h=0;h<q.length;h++){const c=q[h];if(c===ei)break;const cx=c%G,cz=(c/G)|0;
    for(const d of shuffle(DIRS.slice())){const nx=cx+d[0],nz=cz+d[1];if(!isRoad(nx,nz))continue;const ni=nz*G+nx;if(prev[ni]!==-1)continue;prev[ni]=c;q.push(ni);}}
  const out=[];let c=ei;if(prev[c]===-1)return[s];while(c!==si){out.push([c%G,(c/G)|0]);c=prev[c];}out.push(s);return out.reverse();
}
const pathCache=new Map();
function rawPath(A,B){
  let best=null,bd=1e9;
  for(const a of A.doors)for(const b of B.doors){const d=Math.abs(a.rc[0]-b.rc[0])+Math.abs(a.rc[1]-b.rc[1]);if(d<bd){bd=d;best=[a,b];}}
  const key=A.id+'>'+B.id;let pts=pathCache.get(key);
  if(!pts){
    const cells=bfs(best[0].rc,best[1].rc);
    pts=[best[0].d.slice(),...cells.map(c=>[W(c[0]),W(c[1])]),best[1].d.slice()];
    const s=[pts[0]];
    for(let i=1;i<pts.length-1;i++){const a=s[s.length-1],b=pts[i],c=pts[i+1];const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(Math.abs(cr)>1e-6)s.push(b);}
    s.push(pts[pts.length-1]);pts=s;pathCache.set(key,pts);
  }
  return pts;
}
function offsetPath(pts,off){
  const o=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    let d1x=b[0]-a[0],d1z=b[1]-a[1],l1=Math.hypot(d1x,d1z)||1;d1x/=l1;d1z/=l1;
    let d2x=c[0]-b[0],d2z=c[1]-b[1],l2=Math.hypot(d2x,d2z)||1;d2x/=l2;d2z/=l2;
    const n1x=-d1z,n1z=d1x,n2x=-d2z,n2z=d2x,dt=1+n1x*n2x+n1z*n2z;
    if(dt<.2)o.push([b[0]+n1x*off,b[1]+n1z*off]);else o.push([b[0]+(n1x+n2x)/dt*off,b[1]+(n1z+n2z)/dt*off]);
  }
  o.push(pts[pts.length-1]);return o;
}
const near=(list,from,n)=>list.slice().sort((a,b)=>(Math.abs(a.cx-from.cx)+Math.abs(a.cz-from.cz))-(Math.abs(b.cx-from.cx)+Math.abs(b.cz-from.cz))).slice(0,n);

// ---------- people & schedules ----------
const FIRST=['Maya','Leo','Ava','Noah','Zoe','Eli','Iris','Sam','Nora','Owen','Ruby','Jonah','Lena','Theo','Clara','Miles','Hazel','Felix','June','Omar','Priya','Diego','Mei','Kofi','Ana','Ben','Tess','Ravi','Lucy','Marco','Ines','Cal','Wren','Hugo','Sofia','Amir','Jade','Nico','Rosa','Kai','Ellie','Tomas','Yara','Gus','Dina','Ezra','Lola','Ivan','Nell','Raf'];
const LAST=['Ortiz','Park','Novak','Reyes','Chen','Brooks','Kowalski','Haddad','Bell','Moreno','Kim','Fischer','Okafor','Silva','Patel','Reed','Lindqvist','Duarte','Nakamura','Hart','Price','Abara','Quinn','Sato','Varga','Ellis','Romero','Fox','Iyer','Walsh'];
const JOBS=['accountant','designer','engineer','clerk','analyst','editor','developer','office manager','assistant','copywriter','planner','translator'];
const SHIRTS=['#3f5e73','#d9a441','#7d9a6a','#c96a4b','#ece6da','#4a4a48','#6f8fa6','#b8846a','#e3c9a0','#5b7552'];
const SKIN=['#f1c9a5','#e0ac83','#c68863','#8d5a3b','#5c3a26','#f6d6bd'];
const SPEED=.4; // cells per game-minute
const people=[];
const MAXP=210;
{
  const slots=[];for(const h of homes)for(let i=0;i<h.cap;i++)slots.push(h);
  shuffle(slots);
  const n=Math.min(MAXP,slots.length);
  for(let i=0;i<n;i++){
    const p={id:i,home:slots[i],name:pick(FIRST)+' '+pick(LAST),spd:rf(.85,1.15),off:rf(.3,.38),ph:rf(0,100),shirt:pick(SHIRTS),skin:pick(SKIN),x:0,z:0,ang:0,vis:false,walk:0,ei:0};
    const r=R();
    p.arch=r<.55?'work':r<.66?'staff':r<.8?'retired':r<.89?'dog':r<.95?'night':'late';
    people.push(p);
  }
}
function buildDay(p){
  const ev=[];let cur=p.anchor,t=p.T0;
  const end=p.T0+DAY;
  const stay=t1=>{if(t1>t){ev.push({k:0,t0:t,t1,pl:cur,why:null});t=t1;}};
  const go=(dst,why)=>{if(dst===cur)return;const pts=offsetPath(rawPath(cur,dst),p.off);const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const len=cum[cum.length-1];const dur=Math.max(4,len/(SPEED*p.spd));ev.push({k:1,t0:t,t1:t+dur,pts,cum,len,from:cur,to:dst,why});t+=dur;cur=dst;};
  const visit=(dst,mins,why)=>{go(dst,why);if(ev.length&&ev[ev.length-1].k===1)ev[ev.length-1].why=why;stay(t+mins);ev[ev.length-1].why=why;};
  const H0=p.home,A=p.arch;
  if(A==='work'){
    stay(H(rf(6,8.6)));go(p.job,'work');
    if(R()<.55){stay(H(rf(11.8,12.9)));const c=pick(near(cafes,p.job,3));visit(c,rf(25,50),'lunch');go(p.job,'work');}
    stay(H(rf(16.5,18.6)));
    if(R()<.4){const r=R(),dst=r<.45?pick(near(cafes,p.job,3)):r<.75?pick(parks):pick(near(shops,p.job,3));visit(dst,rf(40,110),'evening');}
  }else if(A==='staff'){
    const early=p.job.kind===CAFE;
    stay(H(early?rf(4.8,6.4):rf(7.8,9)));go(p.job,'work');stay(H(early?rf(13.4,15):rf(17.4,19)));
    if(R()<.4)visit(pick(parks),rf(30,60),'stroll');
  }else if(A==='retired'){

function evalP(p,gm){
  const ev=p.ev,tt=p.T0+mod(gm-p.T0,DAY);

  const e=ev[lo];p.ei=lo;
  if(e.k===1){
    const s=clamp((tt-e.t0)/(e.t1-e.t0),0,1)*e.len,c=e.cum;let i=0;
    while(i<c.length-2&&c[i+1]<s)i++;
    const a=e.pts[i],b=e.pts[i+1],u=(s-c[i])/((c[i+1]-c[i])||1e-6);
    p.x=a[0]+(b[0]-a[0])*u;p.z=a[1]+(b[1]-a[1])*u;p.ang=Math.atan2(b[0]-a[0],b[1]-a[1]);p.vis=true;p.walk=s;p.moving=true;

const rng=$('rng');
function setShare(){
  const v=+rng.value;applyShare(Math.round(v/100*J),UBI);const s=stats(nBots,UBI),d=S0.cafe?Math.round((s.cafe-S0.cafe)/S0.cafe*100):0;
  rng.style.setProperty('--p',v+'%');$('pct').textContent=v+'%';$('split').textContent=nBots+' of '+J+' jobs';
  $('st').innerHTML='<span><b>'+s.cafe+'</b> café customers'+(d?' <i>'+(d>0?'+':'')+d+'%</i>':'')+'</span><span id="sNow"></span><span><b>'+halfCafes(s)+'/'+cafes.length+'</b> cafés lost half</span><span>peak <b>'+s.peakBots+'</b> robots on roads</span>';
  if(sel)select(sel,selStart);updateHud(gmNow);
}
rng.addEventListener('input',()=>{idle=0;$('hint').style.opacity=0;setShare();});
$('ubi').addEventListener('click',()=>{UBI=!UBI;$('ubi').textContent='UBI: '+(UBI?'on':'off');$('ubi').classList.toggle('on',UBI);setShare();});
const seedBtn=$('seed');seedBtn.textContent='seed '+SEED+' · new city';
seedBtn.addEventListener('click',()=>{const u=new URL(location.href);u.searchParams.set('seed',Math.floor(Math.random()*9999));location.href=u.toString();});
addEventListener('keydown',e=>{if(e.key==='Escape')select(null,anim);});
addEventListener('resize',resize);

// honest size counter: measure this very file
(async()=>{try{const r=await fetch(location.href.split('#')[0],{cache:'force-cache'});const b=await r.blob();$('sig').textContent='1 file · '+(b.size/1024).toFixed(1)+' KB · three.js r128 via CDN';window.__fileBytes=b.size;}catch(_){$('sig').textContent='1 file · three.js r128 via CDN';}})();

// ---------- recording mode: scripted 24 s loop ----------
const LOOP=24;
const seg=(K,t)=>{let i=0;while(i<K.length-2&&t>K[i+1][0])i++;return[K[i],K[i+1]];};
const kf=(K,t)=>{const[a,b]=seg(K,t);return lerp(a[1],b[1],sm(a[0],b[0],t));};
const lin=(K,t)=>{const[a,b]=seg(K,t);return lerp(a[1],b[1],clamp((t-a[0])/(b[0]-a[0]),0,1));};
let hero=null,cafeX=null,K=null,facts=null,recR=0;
function recInit(){
  // hero = the earliest-replaced on-site worker whose handover happens in morning light (shop or cafe preferred)
  let best=null;
  for(const p of workers){if(!p.bot||p.hand<H(6.9)||p.hand>H(8.6))continue;const sc=p.rank-((p.job.kind===SHOP||p.job.kind===CAFE)?40:0);if(!best||sc<best.sc)best={p,sc};}
  hero=best?best.p:workers.find(p=>p.bot);
  cafeX=cafes.slice().sort((a,b)=>(S0.perCafe.get(b.id)||0)-(S0.perCafe.get(a.id)||0))[0];
  const Ha=hero.hand,rh=pctOf(hero),d=hero.job.dir,door=hero.job.doors[0].d;
  K={gm:[[0,Ha-2.5],[4.5,Ha+8.75],[10.5,Ha+128.75],[11.1,H(12.67)],[15.5,H(13.33)],[16.1,H(22.5)],[21,H(23.17)],[24,Ha-2.5+DAY]],
    r:[[0,rh],[5.5,rh],[10,100],[21.2,100],[23.2,rh],[24,rh]],
    zoom:[[0,7],[4.2,7],[6,1.9],[11.2,1.9],[13,2.8],[15.4,2.8],[16.6,1.7],[20.8,1.7],[22.4,1.5],[24,7]],
    el:[[0,.9],[4.2,.9],[6,.62],[22.4,.62],[24,.9]],
    tx:[[0,door[0]],[4.2,door[0]],[6,0],[11.2,0],[13,cafeX.x],[15.4,cafeX.x],[16.6,0],[22.4,0],[24,door[0]]],
    tz:[[0,door[1]],[4.2,door[1]],[6,0],[11.2,0],[13,cafeX.z],[15.4,cafeX.z],[16.6,0],[22.4,0],[24,door[1]]],
    az0:0};
  // look along the street, from the side where the robot rolls in towards the camera
  evalP(hero.bot,Ha-2.5);const vx=hero.bot.x-door[0],vz=hero.bot.z-door[1],a0=Math.atan2(d[1],d[0]);
  K.az0=[a0+1.05,a0-1.05].sort((a,b)=>(Math.cos(a)*vx+Math.sin(a)*vz)-(Math.cos(b)*vx+Math.sin(b)*vz))[0];
  // numbers for the captions, counted from the sim at 100% robots, no UBI
  applyShare(J,false);let ppl=0,bots=0;
  for(const p of people){evalP(p,H(23));if(p.vis)ppl++;}
  for(const r of robots){evalP(r,H(23));if(r.vis)bots++;}
  facts={cafe0:S0.cafe,cafe100:stats(J,false).cafe,ppl23:ppl,bots23:bots};
}
window.__duration=LOOP;
window.__seek=function(t){
  REC=true;document.body.classList.add('rec');
  t=mod(t,LOOP);if(!hero)recInit();
  const gm=mod(lin(K.gm,t),DAY),r=kf(K.r,t);recR=r;gmNow=gm;
  const n=Math.round(r/100*J);if(n!==nBots||UBI)applyShare(n,false);
  const f=sm(.1,.5,t)*(1-sm(4.0,4.6,t));
  if(f>0&&sel!==hero)select(hero,0);else if(f<=0&&sel)select(null,0);
  route.visible=routeO.visible=stops.visible=stopDots.visible=false;
  view.az=K.az0+.25*(1-Math.cos(2*Math.PI*t/LOOP));view.el=kf(K.el,t);
  view.zoom=kf(K.zoom,t);view.tx=kf(K.tx,t);view.tz=kf(K.tz,t);view.card=0;
  update(gm,t,f);
  const b=hero.bot;ring2.visible=f>0&&b.on;if(ring2.visible){ring2.position.set(b.x,.017,b.z);ring2.scale.setScalar(1+.18*Math.sin(t*6));ring2.material.opacity=f;}
  render();updateHud(gm);
  return true;
};

// ---------- recorded frame = WebGL canvas + overlay drawn in 2D (DOM is not in toDataURL) ----------
const comp=document.createElement('canvas'),g2=comp.getContext('2d');
const UIF='ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif';
const CAPS=[
  [0,1.55,()=>fmtTime(Math.round(hero.hand))+'. A robot clocks in.'],
  [1.75,4.4,()=>hero.name.split(' ')[0]+', '+hero.title+', clocks out.'],
  [6.2,10.3,()=>'Now robots take every job.'],
  [11.4,15.3,()=>'Café customers: '+facts.cafe0+' → '+facts.cafe100+'.'],
  [16.3,20.8,()=>'11 PM. '+facts.bots23+' robots. '+facts.ppl23+(facts.ppl23===1?' person.':' people.')],
  [21.3,23.5,()=>'One HTML file. '+((window.__fileBytes||0)/1024).toFixed(1)+' KB.'],
];
function rr(x,y,w,h,r){g2.beginPath();g2.roundRect(x,y,w,h,r);}
function compose(t,opt){
  const W=cv.width,Hh=cv.height,g=g2;if(comp.width!==W||comp.height!==Hh){comp.width=W;comp.height=Hh;}
  const u=W>=900?W/1080:W/640;
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.textAlign='left';g.textBaseline='alphabetic';g.letterSpacing='0px';
  g.drawImage(cv,0,0);
  const night=document.body.classList.contains('night'),ink=night?'#f4eee3':'#2b2a27';
  // header
  g.fillStyle=ink;g.globalAlpha=.8;g.font='800 '+17*u+'px '+UIF;g.letterSpacing=3.4*u+'px';g.fillText('POCKET VICE',40*u,58*u);
  g.globalAlpha=1;g.letterSpacing='0px';g.font='750 '+30*u+'px '+UIF;g.fillText('02 · Robot Shift',40*u,96*u);
  const tm=fmtTime(gmNow).split(' ');g.textAlign='right';g.font='700 '+24*u+'px '+UIF;g.fillText(tm[1],W-40*u,96*u);
  const apw=g.measureText(tm[1]).width;g.font='800 '+62*u+'px '+UIF;g.fillText(tm[0],W-40*u-apw-8*u,96*u);g.textAlign='left';
  // caption (max 6 words)
  if(opt.caption!==false)for(const c of CAPS){let a=sm(c[0]-.01,c[0]+.2,t)*(1-sm(c[1]-.2,c[1],t));if(c===CAPS[0])a=Math.max(t<1?1-sm(c[1]-.2,c[1],t):0,sm(LOOP-.3,LOOP-.05,t));if(a<=0)continue;
    const s=c[2]();g.font='780 '+42*u+'px '+UIF;const w=g.measureText(s).width+64*u,x=(W-w)/2,y=136*u+(1-a)*12*u;
    g.globalAlpha=a;g.fillStyle='rgba(251,248,241,.97)';g.shadowColor='rgba(40,30,20,.22)';g.shadowBlur=24*u;rr(x,y,w,78*u,39*u);g.fill();g.shadowBlur=0;g.shadowColor='transparent';
    g.fillStyle='#2b2a27';g.textAlign='center';g.fillText(s,W/2,y+54*u);g.textAlign='left';g.globalAlpha=1;}
  // slider panel
  const r=Math.round(recR),px=40*u,pw=W-80*u,ph=116*u,py=Hh-ph-52*u;
  g.fillStyle='rgba(251,248,241,.96)';g.shadowColor='rgba(40,30,20,.22)';g.shadowBlur=30*u;g.shadowOffsetY=8*u;rr(px,py,pw,ph,28*u);g.fill();
  g.shadowColor='transparent';g.shadowBlur=0;g.shadowOffsetY=0;
  let x=px+28*u;const yb=py+56*u;
  g.fillStyle='#2b2a27';g.font='800 '+21*u+'px '+UIF;g.letterSpacing=2.4*u+'px';g.fillText('ROBOTS DO',x,yb-4*u);x+=g.measureText('ROBOTS DO').width+14*u;
  g.letterSpacing='0px';g.fillStyle='#ff5a36';g.font='800 '+50*u+'px '+UIF;g.fillText(r+'%',x,yb);x+=g.measureText(r+'%').width+16*u;
  g.fillStyle='#2b2a27';g.font='800 '+21*u+'px '+UIF;g.letterSpacing=2.4*u+'px';g.fillText('OF JOBS',x,yb-4*u);g.letterSpacing='0px';
  g.textAlign='right';g.fillStyle='#7a7468';g.font='650 '+20*u+'px '+UIF;g.fillText('jobs: '+nBots+' robot · '+(J-nBots)+' human',px+pw-28*u,yb-4*u);g.textAlign='left';
  const bx=px+28*u,bw=pw-56*u,by=py+78*u,bh=16*u,kx=bx+bw*r/100;
  g.fillStyle='rgba(43,42,39,.13)';rr(bx,by,bw,bh,bh/2);g.fill();
  if(r>0){g.fillStyle='#ff5a36';rr(bx,by,Math.max(bh,bw*r/100),bh,bh/2);g.fill();}
  g.fillStyle='#fff';g.beginPath();g.arc(kx,by+bh/2,15*u,0,7);g.fill();g.strokeStyle='#ff5a36';g.lineWidth=5*u;g.stroke();
  // signature
  g.fillStyle=ink;g.globalAlpha=.78;g.font='500 '+17*u+'px ui-monospace,Consolas,monospace';
  g.fillText('toy model, my assumptions · 1 file · '+((window.__fileBytes||0)/1024).toFixed(1)+' KB · three.js r128 via CDN',40*u,Hh-20*u);g.globalAlpha=1;
}
window.__comp=comp;
window.__frame=function(t,opt){window.__seek(t);compose(mod(t,LOOP),opt||{});return comp.toDataURL('image/png');};
window.__frameNoData=function(t,opt){window.__seek(t);compose(mod(t,LOOP),opt||{});return true;};
window.__info=function(){
  const i=renderer.info;
  return {seed:SEED,residents:NP,jobs:J,robots:NR,robotJobsNow:nBots,botsOutNow:botsOut,outsideNow:outside,places:places.length,homes:homes.length,offices:offices.length,cafes:cafes.length,shops:shops.length,parks:parks.length,trees:trees.length,lamps:lampN,
    drawCalls:i.render.calls,triangles:i.render.triangles,fps:fps.length,fileBytes:window.__fileBytes||null,webgl2:GL2,
    gpu:(()=>{const gl=renderer.getContext(),x=gl.getExtension('WEBGL_debug_renderer_info');return x?gl.getParameter(x.UNMASKED_RENDERER_WEBGL):'n/a';})()};
};

resize();setLight(gmNow);setShare();
window.__ready=true;
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
