<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Port Calder · one-file city</title>
<meta name="description" content="A GTA-style open city in one HTML file: drive, taxi fares, a checkpoint sprint, a paint shop, traffic and day to night. Built with Claude Opus 5.5.">
<meta name="theme-color" content="#14161a">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#14161a;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#eee;font:14px system-ui}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="h"></canvas>
<div id="err">Could not load three.js from the CDN.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const T3=THREE,Q=new URLSearchParams(location.search),DEMO=Q.has('demo');
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry(20261119),rf=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rf(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
const clamp=(x,a,b)=>x<a?a:x>b?b:x,sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);},lerp=(a,b,t)=>a+(b-a)*t,mod=(a,n)=>((a%n)+n)%n,wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));

// ================= layout: 6x6 blocks, roads every 68 m, the sea to the south =================
const NB=6,BLK=56,RW=12,PP=BLK+RW,HALF=NB*PP/2,L=i=>i*PP-HALF,LANE=2.5,SHORE=HALF+46;
const AVE=['Larch Ave','Harbor Ave','Cypress Ave','Main Ave','Coral Ave','Signal Ave','Bayview Ave'],STR=['Union St','Crescent St','Market St','Juniper St','Palm St','Dune St','Shoreline Dr'];
const blocks=[];for(let bj=0;bj<NB;bj++)for(let bi=0;bi<NB;bi++){let type='mid';if(bi>=2&&bi<=3&&bj>=1&&bj<=2)type='down';else if(bj===5)type='shore';else if(bj===0||bi===0||bi===5)type='low';
  blocks.push({bi,bj,type,x0:L(bi)+RW/2,x1:L(bi+1)-RW/2,z0:L(bj)+RW/2,z1:L(bj+1)-RW/2});}
const blk=(i,j)=>blocks[j*NB+i];blk(1,3).type='park';blk(4,1).type='park';blk(4,4).type='garage';
const GAR={x:86,z:102,x0:78,x1:94,z0:96,z1:108};
const streetAt=(x,z)=>{let bi=0,bd=1e9,bj=0,bz=1e9;for(let i=0;i<=NB;i++){const d=Math.abs(x-L(i));if(d<bd){bd=d;bi=i;}const e=Math.abs(z-L(i));if(e<bz){bz=e;bj=i;}}return bd<bz?AVE[bi]:STR[bj];};

// ================= renderer =================
const cv=document.getElementById('c'),hc=document.getElementById('h'),hg=hc.getContext('2d');
const renderer=new T3.WebGLRenderer({canvas:cv,antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
const MOBILE=Math.min(innerWidth,innerHeight)<700;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,MOBILE?1.4:1.75));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T3.PCFSoftShadowMap;renderer.info.autoReset=false;
const scene=new T3.Scene(),cam=new T3.PerspectiveCamera(60,1,.1,2400);
const FOG=new T3.Color();scene.fog=new T3.Fog(FOG,120,900);
let rt=null;const GL2=renderer.capabilities.isWebGL2;
function makeRT(w,h){if(rt)rt.dispose();const o={type:T3.HalfFloatType};rt=GL2&&T3.WebGLMultisampleRenderTarget?new T3.WebGLMultisampleRenderTarget(w,h,o):new T3.WebGLRenderTarget(w,h,o);if('samples' in rt)rt.samples=4;}
const SUN=new T3.Vector3();
const skyMat=new T3.ShaderMaterial({side:T3.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:SUN},night:{value:0},t:{value:0}},
  vertexShader:'varying vec3 vD;void main(){vD=position;vec4 p=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;gl_Position.z=gl_Position.w;}',
  fragmentShader:`varying vec3 vD;uniform vec3 sun;uniform float night,t;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*n(p);p*=2.03;a*=.5;}return s;}
  void main(){vec3 d=normalize(vD);float y=max(d.y,0.);float s=max(dot(d,sun),0.);float dk=1.-night;
   vec3 zen=mix(vec3(.02,.03,.07),vec3(.17,.33,.66),dk),hor=mix(vec3(.09,.08,.12),vec3(1.,.66,.42),dk);vec3 c=mix(hor,zen,pow(y,.5));
   c+=vec3(1.,.5,.22)*pow(s,5.)*dk*1.1+vec3(1.,.85,.6)*smoothstep(.9993,.9996,s)*20.*step(0.,sun.y);
   if(d.y>0.){vec2 uv=d.xz/(d.y+.12)*1.3+vec2(t*.003,0.);float k=smoothstep(.52,.85,fbm(uv));vec3 cc=mix(vec3(.08,.07,.1),mix(vec3(.95,.55,.4),vec3(1.,.85,.7),pow(s,3.))*(1.+2.*pow(s,10.)),dk);c=mix(c,cc,k*.75*smoothstep(0.,.2,d.y));
    float st=step(.9993,h(floor(d.xz/(d.y+.05)*300.)))*.8*night*smoothstep(.05,.3,d.y)*(1.-k);c+=vec3(st);}
   else c=mix(hor*.7,vec3(.05),clamp(-d.y*4.,0.,1.));
   gl_FragColor=vec4(c,1.);}`});
const sky=new T3.Mesh(new T3.SphereGeometry(2000,48,24),skyMat);scene.add(sky);
const ENVMATS=[];
{const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#4d74b0');gr.addColorStop(.43,'#e8ae84');gr.addColorStop(.5,'#f2c398');gr.addColorStop(.56,'#6e6052');gr.addColorStop(1,'#2e2924');g.fillStyle=gr;g.fillRect(0,0,512,256);
  const et=new T3.CanvasTexture(c);et.encoding=T3.sRGBEncoding;et.mapping=T3.EquirectangularReflectionMapping;scene.environment=new T3.PMREMGenerator(renderer).fromEquirectangular(et).texture;}
const sunL=new T3.DirectionalLight(0xffc28a,2.4);sunL.castShadow=true;sunL.shadow.mapSize.set(MOBILE?1024:2048,MOBILE?1024:2048);
Object.assign(sunL.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:1,far:500});sunL.shadow.bias=-.0005;sunL.shadow.normalBias=.06;scene.add(sunL,sunL.target);
const hemi=new T3.HemisphereLight(0x9fb6e0,0x6b5440,.55);scene.add(hemi);
const std=(o)=>{const m=new T3.MeshStandardMaterial(o);ENVMATS.push(m);return m;};

// ================= textures (all drawn here) =================
function tex(w,h,draw,rep,lin){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new T3.CanvasTexture(c);if(!lin)t.encoding=T3.sRGBEncoding;t.anisotropy=8;t.wrapS=t.wrapT=T3.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);return t;}
const noise=(g,w,h,base,amp,n)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){const v=Math.floor(R()*amp*2-amp);g.fillStyle=v>0?`rgba(255,255,255,${v/255})`:`rgba(0,0,0,${-v/255})`;g.fillRect(R()*w,R()*h,1+R()*2,1+R()*2);}};
const asphalt=tex(512,512,(g,w,h)=>{noise(g,w,h,'#45423f',36,70000);g.fillStyle='rgba(15,13,12,.16)';for(let i=0;i<8;i++){g.beginPath();g.ellipse(R()*w,R()*h,30+R()*90,10+R()*30,R()*3,0,7);g.fill();}},[90,90]);
const concrete=tex(512,512,(g,w,h)=>{noise(g,w,h,'#b6ad9f',20,30000);g.strokeStyle='rgba(60,50,40,.3)';g.lineWidth=2;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(0,i*128);g.lineTo(w,i*128);g.moveTo(i*128,0);g.lineTo(i*128,h);g.stroke();}});
const grass=tex(512,512,(g,w,h)=>{noise(g,w,h,'#5f7d3c',30,60000);});
const sand=tex(512,512,(g,w,h)=>{noise(g,w,h,'#d9c49c',24,60000);},[60,8]);
const WIN=[];for(let ty=0;ty<4;ty++)for(let tx=0;tx<4;tx++)for(let f=0;f<2;f++)for(let b=0;b<2;b++)WIN.push([tx*256+b*128,ty*256+f*128,R()]);
const facade=tex(1024,1024,(g,w,h)=>{noise(g,w,h,'#ffffff',12,30000);for(const [x,y] of WIN){g.fillStyle='rgba(60,50,40,.3)';g.fillRect(x+20,y+14,88,98);const gr=g.createLinearGradient(x,y,x+80,y+100);gr.addColorStop(0,'#61758a');gr.addColorStop(.55,'#28313c');gr.addColorStop(1,'#a3b4c2');g.fillStyle=gr;g.fillRect(x+26,y+20,76,86);g.fillStyle='rgba(235,230,220,.85)';g.fillRect(x+62,y+20,4,86);g.fillStyle='rgba(255,255,255,.6)';g.fillRect(x+18,y+108,92,6);}});
const litT=tex(1024,1024,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);for(const [x,y,r] of WIN)if(r<.42){g.fillStyle=pick(['#ffcf8a','#ffe2b8','#ffd49c','#f5c27a','#fff0d2']);g.fillRect(x+26,y+20,76,86);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+62,y+20,4,86);}});
function signTex(text,bg,fg){return tex(1024,256,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.font='800 120px ui-rounded,"Segoe UI",system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h/2+6);});}

// ================= geometry helpers =================
function merge(list){let n=0;const gs=list.map(g=>{g=g.index?g.toNonIndexed():g;n+=g.attributes.position.count;return g;});const P=new Float32Array(n*3),N=new Float32Array(n*3),U=new Float32Array(n*2);let o=0;
  for(const g of gs){P.set(g.attributes.position.array,o*3);N.set(g.attributes.normal.array,o*3);if(g.attributes.uv)U.set(g.attributes.uv.array,o*2);o+=g.attributes.position.count;}
  const m=new T3.BufferGeometry();m.setAttribute('position',new T3.BufferAttribute(P,3));m.setAttribute('normal',new T3.BufferAttribute(N,3));m.setAttribute('uv',new T3.BufferAttribute(U,2));return m;}
const at=(g,x,y,z,ry,s)=>{const m=new T3.Matrix4().compose(new T3.Vector3(x,y,z),new T3.Quaternion().setFromEuler(new T3.Euler(0,ry||0,0)),new T3.Vector3(s||1,s||1,s||1));return g.clone().applyMatrix4(m);};
const D=new T3.Object3D();
function inst(geo,mat,list,fn,opt){const m=new T3.InstancedMesh(geo,mat,Math.max(1,list.length));m.count=list.length;list.forEach((p,i)=>{D.position.set(0,0,0);D.rotation.set(0,0,0);D.scale.set(1,1,1);fn(p,D);D.updateMatrix();m.setMatrixAt(i,D.matrix);});m.castShadow=!(opt&&opt.noCast);m.receiveShadow=true;scene.add(m);return m;}

// ================= ground, roads, sea =================
const SPAN=NB*PP;
{const g=new T3.Mesh(new T3.PlaneGeometry(3000,3000),std({color:0x6f6a55,roughness:1}));g.rotation.x=-Math.PI/2;g.position.y=-.06;g.receiveShadow=true;scene.add(g);
 const rd=new T3.Mesh(new T3.PlaneGeometry(SPAN+RW,SPAN+RW),std({map:asphalt,roughness:.93}));rd.rotation.x=-Math.PI/2;rd.receiveShadow=true;scene.add(rd);
 const sa=new T3.Mesh(new T3.PlaneGeometry(1200,SHORE-HALF-RW/2+30),std({map:sand,roughness:1}));sa.rotation.x=-Math.PI/2;sa.position.set(0,.01,(HALF+RW/2+SHORE+30)/2);sa.receiveShadow=true;scene.add(sa);}
const sea=new T3.Mesh(new T3.PlaneGeometry(4000,2000),new T3.ShaderMaterial({uniforms:{t:{value:0},day:{value:1},sun:{value:SUN},hor:{value:new T3.Color()},fogC:{value:FOG}},
  vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:`uniform float t,day;uniform vec3 sun,hor,fogC;varying vec3 vW;
  void main(){vec3 n=normalize(vec3(sin(vW.x*.12+t*.9)*.05+sin(vW.z*.21-t*1.3)*.035,1.,cos(vW.x*.27+vW.z*.15+t*.7)*.05+sin(vW.x*.9-t*2.)*.01));
   vec3 v=normalize(cameraPosition-vW);float fr=pow(1.-max(dot(n,v),0.),4.);vec3 deep=mix(vec3(.004,.012,.025),vec3(.02,.13,.19),day);vec3 c=mix(deep,hor,clamp(fr*.9+.06,0.,1.));
   vec3 r=reflect(-v,n);c+=vec3(1.,.75,.5)*pow(max(dot(r,sun),0.),180.)*6.*day;float d=length(vW-cameraPosition);c=mix(c,fogC,smoothstep(150.,1000.,d));gl_FragColor=vec4(c,1.);}`}));
sea.rotation.x=-Math.PI/2;sea.position.set(0,-.05,SHORE+1000);scene.add(sea);
// sidewalks / parks as raised slabs (one merged mesh each)
{const sw=[],gr=[];for(const b of blocks){const g=at(new T3.BoxGeometry(BLK,.18,BLK),(b.x0+b.x1)/2,.09,(b.z0+b.z1)/2);const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*BLK/8,uv.getY(i)*BLK/8);(b.type==='park'?gr:sw).push(g);}
 const a=new T3.Mesh(merge(sw),std({map:concrete,roughness:.85}));a.receiveShadow=true;scene.add(a);const p=new T3.Mesh(merge(gr),std({map:grass,roughness:1}));p.receiveShadow=true;scene.add(p);}
// paint: double yellow centre lines, edge lines, crosswalks, stop lines
{const yl=[],wl=[],cw=[];const Y=std({color:0xd9a520,roughness:.6}),Wm=std({color:0xe9e4d6,roughness:.6});
 for(let i=0;i<=NB;i++)for(let j=0;j<NB;j++){const zc=(L(j)+L(j+1))/2,xc=zc;
   for(const o of [-.18,.18]){yl.push([L(i)+o,zc,0]);yl.push([xc,L(i)+o,1]);}for(const o of [-5.3,5.3]){wl.push([L(i)+o,zc,0]);wl.push([xc,L(i)+o,1]);}}
 inst(new T3.BoxGeometry(.14,.02,PP-RW-2),Y,yl,(p,d)=>{d.position.set(p[0],.012,p[1]);d.rotation.set(0,p[2]?Math.PI/2:0,0);},{noCast:1});
 inst(new T3.BoxGeometry(.14,.02,PP-RW-2),Wm,wl,(p,d)=>{d.position.set(p[0],.012,p[1]);d.rotation.set(0,p[2]?Math.PI/2:0,0);},{noCast:1});
 for(let i=0;i<=NB;i++)for(let j=0;j<=NB;j++)for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]])for(let k=-4;k<=4;k++)cw.push([L(i)+dx*7.6+(dz?k*1.1:0),L(j)+dz*7.6+(dx?k*1.1:0),dx?1:0]);
 inst(new T3.BoxGeometry(.6,.02,2.8),Wm,cw,(p,d)=>{d.position.set(p[0],.013,p[1]);d.rotation.set(0,p[2]?0:Math.PI/2,0);},{noCast:1});}

// ================= buildings: one merged mesh, window glass by day, lit rooms at night =================
const SOLIDS=[];
{const P=[],N=[],U=[],C=[],col=new T3.Color();
 const quad=(a,b,c,d,n,uv,cc)=>{for(const [p,t] of [[a,uv[0]],[b,uv[1]],[c,uv[2]],[a,uv[0]],[c,uv[2]],[d,uv[3]]]){P.push(p[0],p[1],p[2]);N.push(n[0],n[1],n[2]);U.push(t[0],t[1]);C.push(cc.r,cc.g,cc.b);}};
 function box(x0,z0,x1,z1,h,c){const uo=Math.floor(R()*4)*.25,vo=Math.floor(R()*4)*.25,F=[[[x0,z1],[x1,z1],[0,0,1]],[[x1,z1],[x1,z0],[1,0,0]],[[x1,z0],[x0,z0],[0,0,-1]],[[x0,z0],[x0,z1],[-1,0,0]]];
   for(const [a,b,n] of F){const w=Math.hypot(b[0]-a[0],b[1]-a[1]),Uw=w/32,Vh=h/32;quad([a[0],0,a[1]],[b[0],0,b[1]],[b[0],h,b[1]],[a[0],h,a[1]],n,[[uo,vo],[uo+Uw,vo],[uo+Uw,vo+Vh],[uo,vo+Vh]],c);}
   const rc=c.clone().multiplyScalar(.7),z=[.004,.004];quad([x0,h,z1],[x1,h,z1],[x1,h,z0],[x0,h,z0],[0,1,0],[z,z,z,z],rc);SOLIDS.push([x0-.2,z0-.2,x1+.2,z1+.2]);}
 const PAL={down:['#9fb3c2','#b8c4cc','#8fa3b0','#c9c2b4','#a7b9b9'],mid:['#d9c7ad','#c9a88a','#b8b2a6','#e3d6c2','#a98f78','#cfc3b0'],low:['#f2d7c4','#e8e1cf','#d4e3d9','#f3cfae','#dfe6ea'],shore:['#f2d7c4','#e8e1cf','#d4e3d9','#f3cfae','#ffffff'],garage:['#d9c7ad','#c9a88a']};
 const HT={down:[40,96],mid:[14,34],low:[8,15],shore:[8,18],garage:[10,16]},SPL={down:[2,2],mid:[2,3],low:[3,3],shore:[3,2],garage:[1,2]};
 const roofs=[];
 for(const b of blocks){if(b.type==='park')continue;let x0=b.x0+3,x1=b.x1-3,z0=b.z0+3,z1=b.z1-3;if(b.type==='garage')x0=GAR.x1+4;
   const [nx,nz]=SPL[b.type];const cut=(a,c,n)=>{const r=[a];for(let k=1;k<n;k++)r.push(lerp(a,c,k/n)+rf(-3,3));r.push(c);return r;},XS=cut(x0,x1,nx),ZS=cut(z0,z1,nz);
   for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){if(b.type!=='down'&&R()<.08)continue;const h=Math.round(rf(HT[b.type][0],HT[b.type][1])/4)*4;col.set(pick(PAL[b.type]));
     const g=b.type==='down'?0:.6;box(XS[i]+g,ZS[j]+g,XS[i+1]-g,ZS[j+1]-g,h,col.clone());if(R()<.7)roofs.push([(XS[i]+XS[i+1])/2+rf(-3,3),h,(ZS[j]+ZS[j+1])/2+rf(-3,3)]);}}
 const geo=new T3.BufferGeometry();geo.setAttribute('position',new T3.Float32BufferAttribute(P,3));geo.setAttribute('normal',new T3.Float32BufferAttribute(N,3));geo.setAttribute('uv',new T3.Float32BufferAttribute(U,2));geo.setAttribute('color',new T3.Float32BufferAttribute(C,3));
 var bMat=std({map:facade,emissiveMap:litT,emissive:0xffffff,emissiveIntensity:0,vertexColors:true,roughness:.62,metalness:.15});const bm=new T3.Mesh(geo,bMat);bm.castShadow=bm.receiveShadow=true;scene.add(bm);
 inst(new T3.BoxGeometry(3,1.6,2.4),std({color:0xa9a49a,roughness:.8}),roofs,(p,d)=>{d.position.set(p[0],p[1]+.8,p[2]);d.rotation.set(0,R()*3,0);});}

// ================= trees, palms, street lamps, traffic lights =================
const OBST=[];
{const trees=[],palms=[];
 for(const b of blocks){if(b.type==='park'){for(let k=0;k<26;k++){const x=rf(b.x0+4,b.x1-4),z=rf(b.z0+4,b.z1-4);(R()<.4?palms:trees).push([x,z,rf(.85,1.25)]);OBST.push([x,z,.6]);}}
   else if(b.type!=='down')for(let s=b.x0+6;s<b.x1-4;s+=11){trees.push([s,b.z0+1.6,rf(.8,1.1)]);trees.push([s,b.z1-1.6,rf(.8,1.1)]);}}
 for(let x=-HALF-150;x<HALF+150;x+=13){palms.push([x+rf(-2,2),HALF+RW/2+4,rf(.9,1.2)]);if(R()<.5)palms.push([x+rf(-4,4),HALF+rf(24,36),rf(.8,1.2)]);}
 for(let x=GAR.x0;x<=GAR.x1;x+=8)palms.push([x,GAR.z0-3,1]);
 const trunk=std({color:0x5a4636,roughness:.9}),leaf=std({color:0xffffff,roughness:.85,flatShading:true});
 const tk=inst(new T3.CylinderGeometry(.18,.28,4,7).translate(0,2,0),trunk,trees,(p,d)=>{d.position.set(p[0],.18,p[1]);d.rotation.set(0,p[0],0);d.scale.setScalar(p[2]);});
 const cr=inst(new T3.IcosahedronGeometry(2.4,1).translate(0,5.2,0),leaf,trees,(p,d)=>{d.position.set(p[0],.18,p[1]);d.rotation.set(0,p[0],0);d.scale.setScalar(p[2]);});

// ================= step / draw =================
