<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket Vice</title>
<meta name="description" content="Tiny living cities, one HTML file each.">
<style>
:root{--ink:#2b2a27;--muted:#7a7468;--accent:#ff5a36;--bg:#e9e2d3;--card:#fbf8f1}
@media (prefers-color-scheme:dark){:root{--ink:#f4eee3;--muted:#b9b2a5;--bg:#262a31;--card:#30343c}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:48px 16px}
b.k{font-size:11px;letter-spacing:.2em;opacity:.8}
h1{margin:6px 0 4px;font-size:30px}
p{color:var(--muted);margin:0 0 28px}
a.b{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 6px 20px rgba(40,30,20,.1)}
a.b i{font-style:normal;font-weight:800;color:var(--accent);font-size:20px}
a.b span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<main>
<b class="k">POCKET VICE</b>
<h1>Tiny living cities</h1>
<p>One HTML file each. You don't play a criminal, you play the city's systems.</p>
<a class="b" href="builds/01-clockwork-block/"><i>01</i><div><b>Clockwork Block</b><span>210 people, 210 daily schedules. Tap anyone to see their day.</span></div></a>
<a class="b" style="margin-top:12px" href="builds/02-robot-shift/"><i>02</i><div><b>Robot Shift</b><span>186 jobs, one slider. Hand them to robots and watch the day change. Toy model.</span></div></a>
</main>
</body>
</html>
